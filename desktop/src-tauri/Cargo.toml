# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "simple-apb-desktop"
version = "0.5.2"
description = "Simple APB for Windows"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "simple_apb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "macros", "rt-multi-thread"] }
futures-util = "0.3"
url = "2.5"
percent-encoding = "2.3"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3.6", features = ["windows-native"] }
log = "0.4"

[target.'cfg(windows)'.dependencies]
souvlaki = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

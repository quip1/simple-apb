# SPDX-License-Identifier: AGPL-3.0-or-later
# A release (docs/UPDATING.md, ADR-0049). Pushing a tag vX.Y.Z (made after
# `node scripts/release.mjs X.Y.Z` and its commit) builds and publishes:
#   - the server image: ghcr.io/<owner>/simple-apb-server:X.Y.Z (and X.Y, latest)
#   - the signed Android APK (github flavor) and the Play bundle
#   - the Windows installer
#   - a GitHub release with those files and the changelog section
# The apps and the server's admin panel look for new versions here.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Every part must carry the tag's version
        run: |
          v="${GITHUB_REF_NAME#v}"
          node scripts/release.mjs "$v" --check
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$v" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  server-image:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        name: Image tags
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/simple-apb-server"
          v="${{ needs.version.outputs.version }}"
          tags="$img:$v"
          if [ "${{ needs.version.outputs.prerelease }}" = "false" ]; then
            tags="$tags,$img:${v%.*},$img:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        env:
          # No build-record artifact: the publish job collects artifacts by name.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

  android:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Unpack the signing keys
        id: keys
        env:
          RELEASE_KEYSTORE: ${{ secrets.SIMPLEAPB_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE: ${{ secrets.SIMPLEAPB_PLAY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE" ]; then
            echo "::warning::No Android signing key (SIMPLEAPB_KEYSTORE_BASE64): this release has no APK. See docs/ANDROID-RELEASE.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIMPLEAPB_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          if [ -n "$PLAY_KEYSTORE" ]; then
            echo "$PLAY_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "SIMPLEAPB_PLAY_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi
      - name: Build
        if: steps.keys.outputs.skip != 'true'
        env:
          SIMPLEAPB_KEYSTORE_PASSWORD: ${{ secrets.SIMPLEAPB_KEYSTORE_PASSWORD }}
          SIMPLEAPB_KEY_ALIAS: ${{ secrets.SIMPLEAPB_KEY_ALIAS }}
          SIMPLEAPB_KEY_PASSWORD: ${{ secrets.SIMPLEAPB_KEY_PASSWORD }}
          SIMPLEAPB_PLAY_KEYSTORE_PASSWORD: ${{ secrets.SIMPLEAPB_PLAY_KEYSTORE_PASSWORD }}
          SIMPLEAPB_PLAY_KEY_ALIAS: ${{ secrets.SIMPLEAPB_PLAY_KEY_ALIAS }}
          SIMPLEAPB_PLAY_KEY_PASSWORD: ${{ secrets.SIMPLEAPB_PLAY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:checkFdroid :app:assembleGithubRelease :app:bundlePlayRelease
      - name: Check the signatures and name the files
        if: steps.keys.outputs.skip != 'true'
        run: |
          v="${{ needs.version.outputs.version }}"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/github/release/app-github-release.apk
          jarsigner -verify app/build/outputs/bundle/playRelease/app-play-release.aab | grep "jar verified"
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/github/release/app-github-release.apk "$RUNNER_TEMP/out/simple-apb-android-$v.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "$RUNNER_TEMP/out/simple-apb-android-$v-play.aab"
      # The preset APK (ADR-0050): the same github build with one server baked in, from
      # the SIMPLEAPB_PRESET_SERVER secret. The repository never names a server.
      - name: Preset APK
        if: steps.keys.outputs.skip != 'true'
        env:
          PRESET: ${{ secrets.SIMPLEAPB_PRESET_SERVER }}
          SIMPLEAPB_KEYSTORE_PASSWORD: ${{ secrets.SIMPLEAPB_KEYSTORE_PASSWORD }}
          SIMPLEAPB_KEY_ALIAS: ${{ secrets.SIMPLEAPB_KEY_ALIAS }}
          SIMPLEAPB_KEY_PASSWORD: ${{ secrets.SIMPLEAPB_KEY_PASSWORD }}
        run: |
          if [ -z "$PRESET" ]; then
            echo "No SIMPLEAPB_PRESET_SERVER secret: no preset APK in this release."
            exit 0
          fi
          v="${{ needs.version.outputs.version }}"
          SIMPLEAPB_PRESET_SERVER="$PRESET" ./gradlew --no-daemon :app:assembleGithubRelease
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify app/build/outputs/apk/github/release/app-github-release.apk
          cp app/build/outputs/apk/github/release/app-github-release.apk "$RUNNER_TEMP/out/simple-apb-android-$v-preset.apk"
      - name: Forget the keys
        if: always()
        run: rm -f "$RUNNER_TEMP"/*.jks
      - uses: actions/upload-artifact@v7
        if: steps.keys.outputs.skip != 'true'
        with:
          name: android
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - name: Installer
        run: npm run build
        working-directory: desktop
      - name: Name the file
        shell: bash
        run: |
          mkdir -p out
          cp desktop/src-tauri/target/release/bundle/nsis/*-setup.exe "out/simple-apb-windows-${{ needs.version.outputs.version }}-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, server-image, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Only the app files: other artifacts (such as a Docker build record) aren't release files.
      - uses: actions/download-artifact@v8
        with:
          pattern: "{android,windows}"
          path: dist
          merge-multiple: true
      - name: Release notes from the changelog
        run: |
          v="${{ needs.version.outputs.version }}"
          awk -v h="## [$v]" 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on { print }' CHANGELOG.md > notes.md
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/simple-apb-server:$v"
          {
            echo
            echo "---"
            echo
            echo "**Server:** \`docker pull $img\`, or **Admin → Updates → Update now** (docs/UPDATING.md)."
            echo
            echo "**Android:** \`simple-apb-android-$v.apk\` (installs over the previous version). **Windows:** \`simple-apb-windows-$v-setup.exe\`."
            if [ -f "dist/simple-apb-android-$v-preset.apk" ]; then
              echo
              echo "\`simple-apb-android-$v-preset.apk\` is set up for one server: it opens straight to that server's sign-in."
            fi
          } >> notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ needs.version.outputs.version }}"
          pre=""
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then pre="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --title "Simple APB $v" --notes-file notes.md $pre dist/*

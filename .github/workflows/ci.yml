name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # OpenAPI spec: lint, TS client generation is up to date and compiles, API docs up to date.
  api-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint:api
      - run: npm run gen:api
      - run: npm run gen:docs
      - name: Generated files are committed and current
        run: git diff --exit-code -- src/api/schema.gen.ts ../docs/API.md
      - run: npm run typecheck

  server:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: simpleapb
          POSTGRES_PASSWORD: simpleapb
          POSTGRES_DB: simpleapb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U simpleapb"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      SIMPLEAPB_TEST_POSTGRES_DSN: ${{ matrix.db == 'postgres' && 'postgres://simpleapb:simpleapb@localhost:5432/simpleapb_test?sslmode=disable' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go generate ./...
      - name: Generated Go code is committed and current
        run: git diff --exit-code -- internal/api/api.gen.go
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -o bin/simpleapb ./cmd/simpleapb

  server-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: server

  kotlin-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.1.0"
      - name: Generate and compile the Kotlin API client
        run: gradle -p android :core-api:build --no-daemon

  docker-image:
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: simpleapb-server:ci

# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # OpenAPI spec lint, generated TS client and API docs up to date, web app type-checks and builds.
  api-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint:api
      - run: npm run gen:api
      - run: npm run gen:docs
      - name: Generated files are committed and current
        run: git diff --exit-code -- src/api/schema.gen.ts ../docs/API.md
      - name: Svelte + TypeScript checks (no warnings allowed)
        run: npm run check
      - run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build

  server:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: simpleapb
          POSTGRES_PASSWORD: simpleapb
          POSTGRES_DB: simpleapb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U simpleapb"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      SIMPLEAPB_TEST_POSTGRES_DSN: ${{ matrix.db == 'postgres' && 'postgres://simpleapb:simpleapb@localhost:5432/simpleapb_test?sslmode=disable' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install ffmpeg (media and import integration tests use real audio)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Install pg_dump 17 (backups must match the server major version)
        if: matrix.db == 'postgres'
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q --no-install-recommends postgresql-client-17
          echo "SIMPLEAPB_PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump" >> "$GITHUB_ENV"
      - run: go generate ./...
      - name: Generated Go code is committed and current
        run: git diff --exit-code -- internal/api/api.gen.go
      - run: go vet ./...
      - name: go test
        run: |
          set -o pipefail
          go test -race -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/go-test.log"
      - name: Show failing tests as an annotation
        if: failure()
        run: |
          grep -B3 -A40 -E "^(--- FAIL|panic:|WARNING: DATA RACE)|_test[.]go:[0-9]+:" "$RUNNER_TEMP/go-test.log" | head -200 > "$RUNNER_TEMP/fail.txt" || true
          msg=$(sed -e "s/%/%25/g" "$RUNNER_TEMP/fail.txt" | awk 1 ORS="%0A")
          echo "::error title=go test failures::$msg"
      - run: go build -o bin/simpleapb ./cmd/simpleapb

  # Playwright journey (brief §15): sign-up → approval → upload → share → play → sync,
  # against a real server binary with the embedded web app.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install ffmpeg (the server probes uploads; the tests make an mp3)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - run: npm ci
        working-directory: web
      - name: Build the web app into the server
        run: npm run build:embed
        working-directory: web
      - run: go build -o bin/simpleapb ./cmd/simpleapb
        working-directory: server
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  server-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: server

  # Android (brief §14): generated API client, core modules and the phone app in
  # all three flavors; ktlint, Android lint (warnings fail), unit tests (Robolectric),
  # and a minified F-Droid release build to check R8.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build, lint and test
        run: ./gradlew --no-daemon ktlintCheck test assembleDebug :app:lintFdroidDebug :app:assembleFdroidRelease :app:checkFdroid
      # Debug APKs of every flavor, to install for testing (signed with this run's debug key).
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks-${{ github.sha }}
          path: android/app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # The Windows app (desktop/, ADR-0047): Rust checks, tests and the installer.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - name: Build the web app for the desktop
        run: npm run build:desktop
        working-directory: web
      - name: Format, lint and test
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Installer
        run: npm run build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.sha }}
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  docker-image:
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: simpleapb-server:ci

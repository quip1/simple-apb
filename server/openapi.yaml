# SPDX-License-Identifier: AGPL-3.0-or-later
#
# SOURCE OF TRUTH for the Simple APB API. Edit this first, then regenerate:
#   Go:     cd server && go generate ./...
#   TS:     cd web && npm run gen:api
#   Kotlin: android/core-api generates at build time
#   Docs:   cd web && npm run gen:docs
#
# v0 scope (Phase 0): instance info, auth, me/sessions, library, progress + delta
# sync, media/streaming. Setup wizard, uploads, admin, social etc. come later.
openapi: 3.0.3
info:
  title: Simple APB API
  version: 0.12.0
  description: |
    REST API for Simple APB. All endpoints live under `/api/v1`.

    **Conventions**
    - Every response carries an `X-Server-Version` header.
    - IDs are UUIDv7 strings. Positions and durations are integer milliseconds.
    - Timestamps are RFC 3339 UTC.
    - Errors use the `Error` schema with a stable machine-readable `code`.
    - List endpoints use opaque cursor pagination (`cursor` in, `next_cursor` out).
    - Clients authenticate with a Bearer access token (apps) or the
      `sapb_session` cookie plus `X-CSRF-Token` header (web).
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1

security:
  - bearerAuth: []
  - cookieAuth: []

tags:
  - name: instance
    description: Public instance info and health
  - name: auth
    description: Sign-up, login, tokens and two-factor auth
  - name: me
    description: The signed-in user and their device sessions
  - name: library
    description: Browsing the books visible to the user
  - name: progress
    description: Listening progress and delta sync
  - name: media
    description: Audio files, HLS streams, covers and signed cast URLs
  - name: setup
    description: First-run setup wizard (needs the one-time setup token from the server log)
  - name: uploads
    description: Resumable uploads (tus) and background jobs
  - name: social
    description: Reviews, recommendations, who's listening, reports and sharing
  - name: admin
    description: Instance administration (admin role only)

paths:
  # ───────────────────────────── Instance ─────────────────────────────
  /health:
    get:
      tags: [instance]
      operationId: getHealth
      summary: Liveness check (used by container healthchecks)
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /instance:
    get:
      tags: [instance]
      operationId: getInstance
      summary: Public instance information
      description: Name, version, client version guard, sign-up state, legal text, login options.
      security: []
      responses:
        "200":
          description: Instance info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instance" }

  # ─────────────────────────────── Auth ───────────────────────────────
  /auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: Request an account (creates a pending user awaiting admin approval)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "202":
          description: Request received; an admin must approve it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with username + password
      description: |
        Returns tokens, or `totp_required` with a short-lived challenge to pass to
        `POST /auth/totp/verify`. Pending/denied users get 403 with a code that
        says so.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in, or second factor needed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/totp/verify:
    post:
      tags: [auth]
      operationId: verifyTotp
      summary: Complete login with a TOTP code or a recovery code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpVerifyRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/totp/enroll:
    post:
      tags: [auth]
      operationId: enrollTotp
      summary: Start TOTP enrollment (returns secret + otpauth URI)
      responses:
        "200":
          description: Enrollment started; confirm with a code to activate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpEnrollment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/totp/confirm:
    post:
      tags: [auth]
      operationId: confirmTotp
      summary: Confirm TOTP enrollment; returns the 10 one-time recovery codes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpConfirmRequest" }
      responses:
        "200":
          description: TOTP active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Exchange a refresh token for a new token pair (rotating)
      description: |
        The old refresh token is invalidated. Reusing an already-rotated refresh
        token revokes the whole device session (theft detection). Web clients
        send no body; the refresh cookie is used.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current device session
      responses:
        "204": { description: "Logged out" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ──────────────────────────────── Me ────────────────────────────────
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: The current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Edit my profile and preferences
      description: Only the fields present are changed. `prefs` replaces the stored object (last write wins).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MePatch" }
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /me/password:
    post:
      tags: [me]
      operationId: changeMyPassword
      summary: Change my password (signs out my other devices)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: "Changed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me/totp/disable:
    post:
      tags: [me]
      operationId: disableMyTotp
      summary: Turn off two-factor authentication
      description: Needs the password and a current code. Refused (403 `totp_required`) for admins and when a tag or the instance requires 2FA.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpDisable" }
      responses:
        "204": { description: "Turned off" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me/recovery-codes:
    post:
      tags: [me]
      operationId: regenerateRecoveryCodes
      summary: Replace my recovery codes (the old ones stop working)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCode" }
      responses:
        "200":
          description: Ten new codes, shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me/stats:
    get:
      tags: [me]
      operationId: getMyStats
      summary: My listening stats for a year (charts and year in review)
      description: |
        Built from listening history. Listening time is real time (at 2× speed, an hour of
        book counts as 30 minutes); seeks and pauses don't count. Days are calendar days in `tz`.
      parameters:
        - name: year
          in: query
          description: Defaults to the current year in `tz`
          schema: { type: integer, minimum: 2000, maximum: 2200 }
        - name: tz
          in: query
          description: IANA time zone, e.g. Europe/Berlin
          schema: { type: string, default: UTC, maxLength: 64 }
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/sessions:
    get:
      tags: [me]
      operationId: listMySessions
      summary: My device sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [me]
      operationId: revokeMyOtherSessions
      summary: Sign out all my other devices
      responses:
        "204": { description: "Revoked" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/sessions/{sessionId}:
    delete:
      tags: [me]
      operationId: revokeMySession
      summary: Revoke one of my sessions
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204": { description: "Revoked" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ────────────────────────────── Library ─────────────────────────────
  /library:
    get:
      tags: [library]
      operationId: listLibrary
      summary: My library (own uploads ∪ distributions, minus removed/hidden/filtered/taken down)
      parameters:
        - name: shelf
          in: query
          schema:
            type: string
            enum: [all, in_progress, not_started, finished, archived, recently_removed]
            default: all
        - { name: series, in: query, schema: { type: string, format: uuid } }
        - { name: author, in: query, schema: { type: string, format: uuid } }
        - { name: narrator, in: query, schema: { type: string, format: uuid } }
        - { name: tag, in: query, description: "Genre or custom book tag id", schema: { type: string, format: uuid } }
        - { name: collection, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, description: "Full-text search over title/author/narrator/series", schema: { type: string, maxLength: 200 } }
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent_added, recent_played, title, author, series, duration]
            default: recent_added
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of books
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /library/facets:
    get:
      tags: [library]
      operationId: listLibraryFacets
      summary: Series, authors, narrators or tags in my library, with book counts
      description: Powers the Library's Series/Authors/Narrators/Genres views. Counts only books on the "all" shelf (not archived or removed).
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [series, authors, narrators, tags] }
      responses:
        "200":
          description: Facets, by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LibraryFacet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /books/{bookId}:
    get:
      tags: [library]
      operationId: getBook
      summary: Book detail (files, chapters, my progress)
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [library]
      operationId: updateBookMetadata
      summary: Edit a book's metadata (edited fields are locked; brief §6.12)
      description: |
        Admins may edit any book, users with `can_edit_metadata` only books they
        uploaded. Every field you send is saved and locked, so the online
        providers never overwrite it; `unlock` releases fields again. Editing
        clears the book's "needs review" flag.
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookMetadataPatch" }
      responses:
        "200":
          description: The book after the edit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/library/{bookId}:
    delete:
      tags: [library]
      operationId: removeFromMyLibrary
      summary: Remove a book from my view (restorable for 30 days; master copy is kept)
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: "Removed from my library" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/library/{bookId}/restore:
    post:
      tags: [library]
      operationId: restoreToMyLibrary
      summary: Restore a book from "Recently removed", or un-archive it
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: "Restored" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }

  /me/library/{bookId}/hide:
    post:
      tags: [library]
      operationId: hideInMyLibrary
      summary: Archive (hide) a book in my library
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: "Archived" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /authors/{personId}:
    get:
      tags: [library]
      operationId: getAuthor
      summary: Author page (books visible to me)
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Author
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /narrators/{personId}:
    get:
      tags: [library]
      operationId: getNarrator
      summary: Narrator page (books visible to me)
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Narrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /series/{seriesId}:
    get:
      tags: [library]
      operationId: getSeries
      summary: Series page (books in order, visible to me)
      parameters:
        - name: seriesId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── Progress ─────────────────────────────
  /me/progress/{bookId}:
    get:
      tags: [progress]
      operationId: getProgress
      summary: My stored progress for a book
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Progress" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [progress]
      operationId: putProgress
      summary: Report playback position
      description: |
        Sent every 15 s while playing, on pause/stop/seek and on app background;
        queued in a local outbox while offline and flushed in order.

        The server keeps the latest record by `client_ts`. If the incoming
        position differs from the stored one by more than the user's conflict
        threshold (default 3 min) **and** the two writes came from different
        devices within the same offline window, the server answers **409** with
        both candidates. The client asks the user, then re-sends the chosen
        position with `resolution` set to the returned `conflict_id`; that
        write always wins and is logged.
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgressUpdate" }
      responses:
        "200":
          description: Stored (or ignored as older than the stored record — see `applied`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressWriteResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Position conflict between devices; the user must choose
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressConflict" }

  /me/sync:
    get:
      tags: [progress]
      operationId: getSyncDelta
      summary: Everything that changed for me since a cursor
      description: |
        The single call clients make on reconnect. Omit `since` for a full
        snapshot. Returns library visibility changes, progress, bookmarks,
        collections and tombstones. While `has_more` is true, call again with
        the returned `cursor`; store the final one. A tombstone for a
        `library_entry` means the book is no longer visible to you.

        Open clients can also connect to the WebSocket at `/ws` (Bearer header or
        session cookie), which sends `{"type":"changed","seq":N}` hints so they
        sync immediately.
      parameters:
        - name: since
          in: query
          description: Opaque cursor from a previous response
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Delta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncDelta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "410":
          description: Cursor too old (change log pruned); do a full sync without `since`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ────────────────────────────── Media ───────────────────────────────
  /books/{bookId}/files/{fileId}:
    get:
      tags: [media]
      operationId: getBookFile
      summary: Original audio file (supports HTTP Range)
      description: Auth by token/cookie, or by a signed `sig` from `POST /books/{bookId}/stream-url`.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - streamSignature: []
      parameters:
        - $ref: "#/components/parameters/BookId"
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          required: false
          schema: { type: string, example: "bytes=0-1048575" }
        - name: download
          in: query
          required: false
          description: "Set for bulk downloads (offline copies). Unset = live playback, which gets a guaranteed share of bandwidth (bitrate × 1.5) before downloads are served."
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Whole file
          headers:
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
          content:
            audio/*:
              schema: { type: string, format: binary }
        "206":
          description: Partial content
          headers:
            Content-Range: { schema: { type: string } }
          content:
            audio/*:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "416": { description: "Range not satisfiable" }

  /stream/{bookId}/hls/{profile}/index.m3u8:
    get:
      tags: [media]
      operationId: getHlsPlaylist
      summary: Low-bitrate HLS playlist for the whole book (generated on demand)
      security:
        - bearerAuth: []
        - cookieAuth: []
        - streamSignature: []
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/HlsProfile"
      responses:
        "200":
          description: HLS media playlist
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stream/{bookId}/hls/{profile}/{segment}:
    get:
      tags: [media]
      operationId: getHlsSegment
      summary: One 10 s HLS segment
      security:
        - bearerAuth: []
        - cookieAuth: []
        - streamSignature: []
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/HlsProfile"
        - name: segment
          in: path
          required: true
          schema: { type: string, pattern: '^seg_[0-9]{6}\.(ts|m4s|aac)$' }
      responses:
        "200":
          description: Segment
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /books/{bookId}/stream-url:
    post:
      tags: [media]
      operationId: createStreamUrl
      summary: Signed, short-lived stream URLs for casting targets
      description: Bound to user + book; expire after 6 h. Casting devices fetch audio without app tokens.
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StreamUrlRequest" }
      responses:
        "200":
          description: Signed URLs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamUrls" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /books/{bookId}/cover:
    get:
      tags: [media]
      operationId: getBookCover
      summary: Cover image (resized variant)
      security:
        - bearerAuth: []
        - cookieAuth: []
        - streamSignature: []
      parameters:
        - $ref: "#/components/parameters/BookId"
        - name: size
          in: query
          schema: { type: integer, enum: [128, 256, 512, 1024], default: 512 }
        - name: v
          in: query
          description: Cache buster; `cover_url` already carries it (add `size` with `&`)
          schema: { type: string, maxLength: 32 }
      responses:
        "200":
          description: JPEG cover
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [library]
      operationId: setBookCoverFromUrl
      summary: Use a cover image from a metadata provider (same permission as editing)
      description: The URL must come from a provider's image host (as returned in candidates).
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoverFromUrl" }
      responses:
        "204": { description: Cover saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: The image couldn't be downloaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }


  /admin/audit/export:
    get:
      tags: [admin]
      operationId: exportAudit
      summary: The filtered audit log as CSV (at most 100 000 rows)
      parameters:
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditObjectType"
        - $ref: "#/components/parameters/AuditObjectId"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/settings:
    get:
      tags: [admin]
      operationId: getAdminSettings
      summary: Instance settings (secrets are never returned, only whether they're set)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [admin]
      operationId: updateAdminSettings
      summary: Change instance settings (groups and fields present are changed)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSettingsPatch" }
      responses:
        "200":
          description: Settings after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/settings/smtp/test:
    post:
      tags: [admin]
      operationId: testAdminSmtp
      summary: Send a test email with the saved SMTP settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, format: email }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupCheckResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/books:
    get:
      tags: [admin]
      operationId: listMasterBooks
      summary: Browse the master store (every book the server holds)
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/BookStatus" }
        - { name: q, in: query, description: Title search, schema: { type: string, maxLength: 200 } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of books
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterBookPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/books/{bookId}:
    get:
      tags: [admin]
      operationId: getMasterBook
      summary: One master-store book with its distributions
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterBook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin]
      operationId: trashBook
      summary: Move a book to the Trash (hidden everywhere; purged after 30 days)
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: Trashed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/books/{bookId}/restore:
    post:
      tags: [admin]
      operationId: restoreBook
      summary: Restore a book from the Trash
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: Restored }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/books/{bookId}/purge:
    post:
      tags: [admin]
      operationId: purgeBook
      summary: Permanently delete one trashed book and its files now
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: Purged }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/trash/empty:
    post:
      tags: [admin]
      operationId: emptyTrash
      summary: Permanently delete everything in the Trash
      description: "Requires typing the number of trashed books, plus the admin password and a TOTP code."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyTrashRequest" }
      responses:
        "200":
          description: Purged
          content:
            application/json:
              schema:
                type: object
                required: [purged]
                properties:
                  purged: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/distributions:
    post:
      tags: [admin]
      operationId: createDistribution
      summary: Make a master-store book visible to a group or a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DistributionCreate" }
      responses:
        "201":
          description: Distributed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Distribution" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/distributions/{distributionId}:
    delete:
      tags: [admin]
      operationId: revokeDistribution
      summary: Revoke a distribution
      parameters:
        - name: distributionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/library/scan:
    post:
      tags: [admin]
      operationId: scanLibrary
      summary: Rescan the library folder now
      responses:
        "202":
          description: Scan queued
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────── Bookmarks & collections ──────────────────
  /me/bookmarks:
    get:
      tags: [progress]
      operationId: listBookmarks
      summary: My bookmarks (optionally for one book)
      parameters:
        - name: book_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Bookmarks, by book then position
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Bookmark" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [progress]
      operationId: createBookmark
      summary: Add a bookmark
      description: "Clients may send their own `id` (UUID) so an offline-created bookmark syncs idempotently: re-sending the same id returns the existing bookmark."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookmarkCreate" }
      responses:
        "201":
          description: Created (or the existing bookmark with that id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bookmark" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/bookmarks/{bookmarkId}:
    patch:
      tags: [progress]
      operationId: updateBookmark
      summary: Edit a bookmark (last write wins by client_ts)
      parameters:
        - $ref: "#/components/parameters/BookmarkId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookmarkPatch" }
      responses:
        "200":
          description: The bookmark after the write (unchanged if the edit was older)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bookmark" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [progress]
      operationId: deleteBookmark
      summary: Delete a bookmark (leaves a tombstone for other devices)
      parameters:
        - $ref: "#/components/parameters/BookmarkId"
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/collections:
    get:
      tags: [progress]
      operationId: listCollections
      summary: My collections
      responses:
        "200":
          description: Collections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Collection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [progress]
      operationId: createCollection
      summary: Create a collection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionCreate" }
      responses:
        "201":
          description: Created (or the existing collection with that id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/collections/{collectionId}:
    patch:
      tags: [progress]
      operationId: updateCollection
      summary: Rename or describe a collection (last write wins by client_ts)
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionPatch" }
      responses:
        "200":
          description: The collection after the write
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [progress]
      operationId: deleteCollection
      summary: Delete a collection (books are not affected)
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/collections/{collectionId}/books/{bookId}:
    put:
      tags: [progress]
      operationId: addToCollection
      summary: Add a book to a collection
      parameters:
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: Added }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [progress]
      operationId: removeFromCollection
      summary: Remove a book from a collection
      parameters:
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── Devices / push ───────────────────────
  /devices/push-subscription:
    post:
      tags: [me]
      operationId: registerPush
      summary: Register this device for push notifications
      description: |
        Send your UnifiedPush `endpoint` (from the distributor app, e.g. ntfy) and the server
        POSTs events there. Without an endpoint you get a random server topic on this
        instance's ntfy to subscribe to directly. Payloads never contain content, only
        `{"type": "...", "id": "..."}`; fetch details from the API.
        Event types: `upload_done`, `upload_failed`, `library_added` (a share, or a
        recommendation; `id` is the book), and for admins `signup_request`, `report`,
        `review_request`, `backup_failed`, `integrity_failed`, `unclean_shutdown`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushRegistration" }
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushSubscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /devices/push-subscription/{deviceId}:
    delete:
      tags: [me]
      operationId: unregisterPush
      summary: Stop push notifications for a device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Unregistered }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─────────────────────── Admin: updates (brief §6.21) ───────────────
  /admin/update:
    get:
      tags: [admin]
      operationId: getUpdateStatus
      summary: This server's version, the newest release, and the last update
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: startUpdate
      summary: Update the server now (needs the updater container)
      description: |
        Takes a database backup, then asks the updater container (see
        docs/UPDATING.md) to switch to the given release. The updater pulls the
        image, restarts the server, and goes back to the previous version if the
        new one doesn't become healthy. Follow it with `GET /admin/update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRequest" }
      responses:
        "202":
          description: The updater has the request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: No updater is running, or an update is already under way
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The backup before the update failed; nothing was changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/update/check:
    post:
      tags: [admin]
      operationId: checkForUpdate
      summary: Look for a new release now (it is also checked daily)
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ─────────────────────── Admin: backups & integrity ─────────────────
  /admin/backups:
    get:
      tags: [admin]
      operationId: getBackups
      summary: Database backups and the latest backup/scrub status
      responses:
        "200":
          description: Backup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: runBackup
      summary: Back up the database now
      responses:
        "202":
          description: Backup queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/integrity-check:
    post:
      tags: [admin]
      operationId: runIntegrityCheck
      summary: Re-hash every library file against its stored checksum now
      responses:
        "202":
          description: Scrub queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────────── Social ───────────────────────────────
  /books/{bookId}/reviews:
    get:
      tags: [social]
      operationId: listReviews
      summary: Ratings and reviews of a book, newest first, with the average
      description: |
        Hidden reviews are left out of the list and the average, except that
        the author still sees their own (marked hidden) and admins see all of them.
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /books/{bookId}/reviews/mine:
    put:
      tags: [social]
      operationId: putMyReview
      summary: Rate and review a book (creates or replaces your review; needs `can_review`)
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: Your review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [social]
      operationId: deleteMyReview
      summary: Delete your review of a book
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /books/{bookId}/recommend:
    post:
      tags: [social]
      operationId: recommendBook
      summary: Recommend a book to other people
      description: |
        Only people who can already see the book receive it; the rest are
        counted in `skipped`. A recommendation never makes a book visible.
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecommendRequest" }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/recommendations:
    get:
      tags: [social]
      operationId: listMyRecommendations
      summary: Books other people recommended to you (only books you can see)
      responses:
        "200":
          description: Recommendations, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Recommendation" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/recommendations/{recommendationId}:
    delete:
      tags: [social]
      operationId: dismissRecommendation
      summary: Dismiss a recommendation
      parameters:
        - $ref: "#/components/parameters/RecommendationId"
      responses:
        "204": { description: Dismissed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /books/{bookId}/listeners:
    get:
      tags: [social]
      operationId: listListeners
      summary: Who's listening to (or finished) a book
      description: |
        People who turned off "show my listening" in their settings never
        appear. You don't appear in your own list.
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: At most 50 people, most recent first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Listener" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports:
    post:
      tags: [social]
      operationId: createReport
      summary: Report a book, a review or a person to the admins
      description: Reporting the same thing again while your report is open updates it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportCreate" }
      responses:
        "201":
          description: Reported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportRef" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /people:
    get:
      tags: [social]
      operationId: searchPeople
      summary: Find people to recommend or share to (active users in your groups)
      parameters:
        - name: q
          in: query
          required: true
          description: At least 2 characters of a username or display name
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        "200":
          description: At most 10 people
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserRef" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /me/groups:
    get:
      tags: [social]
      operationId: listMyGroups
      summary: The groups you belong to (share targets)
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroupRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /books/{bookId}/shares:
    get:
      tags: [social]
      operationId: listBookShares
      summary: Your shares of a book you uploaded, and your requests to share it publicly
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Shares and requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookShares" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [social]
      operationId: shareBook
      summary: Share a book you uploaded with a person or one of your groups
      description: |
        Needs `can_share` (brief §6.5 rule 6). Sharing with `Public` needs
        `can_post_public` and always goes to the admins' review queue first
        (`status: pending_review`).
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareCreate" }
      responses:
        "201":
          description: Shared, or queued for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /books/{bookId}/shares/{shareId}:
    delete:
      tags: [social]
      operationId: unshareBook
      summary: Stop sharing (or withdraw a pending public request)
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/ShareId"
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/collections/{collectionId}/shares:
    get:
      tags: [social]
      operationId: listCollectionShares
      summary: Who a collection of yours is shared with
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Shares
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CollectionShare" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [social]
      operationId: shareCollection
      summary: Share a collection with a person or one of your groups
      description: People only ever see the books in it that they can already see.
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareCreate" }
      responses:
        "201":
          description: Shared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionShare" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/collections/{collectionId}/shares/{shareId}:
    delete:
      tags: [social]
      operationId: unshareCollection
      summary: Stop sharing a collection with someone
      parameters:
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/ShareId"
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /shared-collections:
    get:
      tags: [social]
      operationId: listSharedCollections
      summary: Collections other people shared with you or your groups
      responses:
        "200":
          description: Collections (only the books you can see)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SharedCollection" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────────────────────── Moderation ───────────────────────────
  /admin/review-queue:
    get:
      tags: [admin]
      operationId: listReviewQueue
      summary: Requests to share books with Public, oldest first
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, rejected], default: pending }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewQueuePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/review-queue/{itemId}/approve:
    post:
      tags: [admin]
      operationId: approveReviewItem
      summary: Approve a request (the book is shared with the group)
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204": { description: Approved }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/review-queue/{itemId}/reject:
    post:
      tags: [admin]
      operationId: rejectReviewItem
      summary: Reject a request (a reason is required and shown to the uploader)
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "204": { description: Rejected }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/reports:
    get:
      tags: [admin]
      operationId: listReports
      summary: Reports, oldest open first (or newest first for closed ones)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved, dismissed], default: open }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of reports
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/reports/{reportId}/resolve:
    post:
      tags: [admin]
      operationId: resolveReport
      summary: Close a report, and every other open report about the same thing
      description: |
        `hide_review` hides the reported review; `takedown` takes the reported
        book (or the reviewed book) down. `resolved` closes the report after
        you acted on the person from their user page. A note is required.
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportResolve" }
      responses:
        "204": { description: Resolved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/reviews/{reviewId}/hide:
    post:
      tags: [admin]
      operationId: hideReview
      summary: Hide a review from everyone but its author (a reason is required)
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "204": { description: Hidden }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin]
      operationId: unhideReview
      summary: Show a hidden review again
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      responses:
        "204": { description: Shown }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── Metadata ─────────────────────────────
  /books/{bookId}/metadata/candidates:
    get:
      tags: [library]
      operationId: listMetadataCandidates
      summary: Look a book up with the metadata providers, best match first (editors only)
      description: Without `title`/`author` the book's own ISBN, ASIN, title and first author are used.
      parameters:
        - $ref: "#/components/parameters/BookId"
        - name: title
          in: query
          schema: { type: string, maxLength: 300 }
        - name: author
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Candidates (at most 5 per provider)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MetadataCandidate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: Every metadata provider failed (offline, or rate-limited)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /books/{bookId}/metadata/refresh:
    post:
      tags: [library]
      operationId: refreshBookMetadata
      summary: Run the metadata pipeline for a book again (editors only)
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── Book tools (brief §6.13) ─────────────
  /books/{bookId}/chapters:
    put:
      tags: [library]
      operationId: setBookChapters
      summary: Replace a book's chapters (book tools; editors only)
      description: |
        Each chapter is given by its start; it ends where the next one starts, and
        the last at the end of the book. The chapters are saved at once and kept
        across re-scans. For a book that is one m4b/m4a file they are also
        written into the file (a remux, no re-encode) by the returned job.
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChaptersUpdate" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChaptersSaved" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /books/{bookId}/chapters/detect:
    post:
      tags: [library]
      operationId: detectBookChapters
      summary: Propose chapters from silences in the audio (book tools; editors only)
      description: |
        Runs `ffmpeg silencedetect` over the book as a job. The job's result is
        `{"chapters": [Chapter…]}`, a proposal: nothing changes until it is saved
        with `PUT /books/{bookId}/chapters`.
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SilenceDetect" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /books/{bookId}/merge:
    post:
      tags: [library]
      operationId: mergeBookToM4b
      summary: Merge a book's files into one chaptered m4b (book tools; editors only)
      description: |
        Concatenates the files in order into one m4b with the book's chapters,
        tags and cover. The audio is copied when every file has the same format,
        and converted to AAC otherwise or when `reencode` is set. With
        `keep_original` the m4b becomes a new book (also needs upload
        permission) and the original stays; otherwise it replaces the files.
        The job's result is `{"book_id": …}`.
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MergeRequest" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already a single m4b, or another tool is running on this book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /books/{bookId}/cover/upload:
    post:
      tags: [library]
      operationId: uploadBookCover
      summary: Use an uploaded image as the cover (book tools; editors only)
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        description: A JPEG or PNG image, up to 10 MB
        content:
          image/*:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Cover saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: The image is larger than 10 MB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /books/{bookId}/cover/embedded:
    post:
      tags: [library]
      operationId: extractBookCover
      summary: Use the cover embedded in the book's audio (book tools; editors only)
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: Cover saved }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The audio has no embedded cover
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/duplicates:
    get:
      tags: [admin]
      operationId: listDuplicates
      summary: Books that look like duplicates, for review (brief §6.13)
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Open duplicate pairs, exact matches first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DuplicatePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/duplicates/scan:
    post:
      tags: [admin]
      operationId: scanDuplicates
      summary: Look for duplicates now (also runs weekly)
      description: |
        Exact matches have the same whole-book checksum. Probable matches have the
        same normalized title and author and durations within 2 %. Pairs already
        decided are not raised again.
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/duplicates/{duplicateId}:
    post:
      tags: [admin]
      operationId: resolveDuplicate
      summary: Keep both books, or merge them into one
      description: |
        `keep` closes the pair. `merge` keeps `keep_book_id` and moves the other
        book to the Trash; first its place in user libraries, groups, collections,
        progress, bookmarks and reviews moves to the kept book (where the kept book
        doesn't already have them).
      parameters:
        - name: duplicateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DuplicateResolve" }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/metadata-review:
    get:
      tags: [admin]
      operationId: listMetadataReview
      summary: Books whose online match was too uncertain to apply ("needs review"), oldest first
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of books
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataReviewPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/metadata-review/{bookId}/dismiss:
    post:
      tags: [admin]
      operationId: dismissMetadataReview
      summary: Keep a book's metadata as it is and clear "needs review"
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: Cleared }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 15-minute access token from login/refresh.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sapb_session
      description: Web/admin. HttpOnly, SameSite=Lax. State-changing requests also need `X-CSRF-Token`.
    setupToken:
      type: apiKey
      in: header
      name: X-Setup-Token
      description: One-time token printed to the server log on first start.
    streamSignature:
      type: apiKey
      in: query
      name: sig
      description: Signed stream token from `POST /books/{bookId}/stream-url`.

  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PersonId:
      name: personId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HlsProfile:
      name: profile
      in: path
      required: true
      schema: { $ref: "#/components/schemas/HlsProfile" }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TagId:
      name: tagId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AuditActor:
      name: actor
      in: query
      description: Actor user id
      schema: { type: string, format: uuid }
    AuditAction:
      name: action
      in: query
      description: Action, or a prefix ending in "." (e.g. "user.")
      schema: { type: string, maxLength: 100 }
    AuditObjectType:
      name: object_type
      in: query
      schema: { type: string, maxLength: 50 }
    AuditObjectId:
      name: object_id
      in: query
      schema: { type: string, maxLength: 100 }
    AuditFrom:
      name: from
      in: query
      schema: { type: string, format: date-time }
    AuditTo:
      name: to
      in: query
      schema: { type: string, format: date-time }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BookmarkId:
      name: bookmarkId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from `next_cursor`
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

    RecommendationId:
      name: recommendationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ShareId:
      name: shareId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReportId:
      name: reportId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found (or not visible to you)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict with current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Gone:
      description: No longer available
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ── common ──
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `invalid_credentials`, `account_pending`, `rate_limited`.
        message:
          type: string
          description: Human-readable English message (clients show their own translated text by `code`).
        details:
          type: object
          additionalProperties: true

    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }

    Instance:
      type: object
      required: [name, version, api_version, min_client_version, signup_open, setup_required, oidc_providers]
      properties:
        name: { type: string }
        version: { type: string, description: "Server semver" }
        api_version: { type: string, example: "v1" }
        min_client_version:
          $ref: "#/components/schemas/ClientVersionGuard"
        signup_open: { type: boolean }
        setup_required: { type: boolean, description: "True until the first-run wizard is finished" }
        privacy_text: { type: string }
        terms_text: { type: string }
        copyright_contact: { type: string }
        email_password_reset: { type: boolean, description: "People can reset a forgotten password by email" }
        oidc_providers:
          type: array
          items: { $ref: "#/components/schemas/OidcProvider" }

    ClientVersionGuard:
      type: object
      description: Clients below `required` must block with "Update required"; below `recommended` show a soft banner.
      properties:
        android: { $ref: "#/components/schemas/VersionPair" }
        wear: { $ref: "#/components/schemas/VersionPair" }
        web: { $ref: "#/components/schemas/VersionPair" }
        windows: { $ref: "#/components/schemas/VersionPair" }

    VersionPair:
      type: object
      required: [required, recommended]
      properties:
        required: { type: string }
        recommended: { type: string }

    OidcProvider:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string }
        display_name: { type: string }

    Platform:
      type: string
      enum: [android, wear, web, windows, other]

    # ── auth ──
    SignupRequest:
      type: object
      required: [username, password, age_confirmed, terms_accepted]
      properties:
        username: { type: string, minLength: 3, maxLength: 32, pattern: '^[a-zA-Z0-9_.-]+$' }
        password: { type: string, minLength: 10, maxLength: 256, format: password }
        email: { type: string, format: email }
        message: { type: string, maxLength: 500, description: "Optional note to the admin" }
        age_confirmed: { type: boolean }
        terms_accepted: { type: boolean }

    SignupAccepted:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending] }

    DeviceInfo:
      type: object
      required: [device_id, device_name, platform, app_version]
      properties:
        device_id: { type: string, format: uuid, description: "Generated once per install" }
        device_name: { type: string, maxLength: 100 }
        platform: { $ref: "#/components/schemas/Platform" }
        app_version: { type: string, maxLength: 32 }

    LoginRequest:
      type: object
      required: [username, password, device]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        device: { $ref: "#/components/schemas/DeviceInfo" }

    LoginResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, totp_required] }
        tokens: { $ref: "#/components/schemas/TokenPair" }
        totp_challenge:
          type: string
          description: Present when `status = totp_required`; valid for 5 minutes.
        user: { $ref: "#/components/schemas/Me" }

    TotpVerifyRequest:
      type: object
      required: [totp_challenge]
      properties:
        totp_challenge: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
        recovery_code: { type: string }

    TotpEnrollment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: "Base32 secret" }
        otpauth_uri: { type: string }

    TotpConfirmRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }

    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    TokenPair:
      type: object
      required: [access_token, access_expires_at, refresh_token, refresh_expires_at]
      properties:
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string, description: "Empty for web clients (cookie is set instead)" }
        refresh_expires_at: { type: string, format: date-time }

    # ── me ──
    UserRole:
      type: string
      enum: [admin, user]

    UserStatus:
      type: string
      enum: [pending, active, restricted, suspended, banned, deleted]

    Me:
      type: object
      required: [id, username, display_name, role, status, totp_enabled, totp_required, quota_bytes, used_bytes, locale, permissions, conflict_threshold_minutes, listening_visible, prefs]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }
        totp_enabled: { type: boolean }
        quota_bytes: { type: integer, format: int64, description: "0 = unlimited" }
        used_bytes: { type: integer, format: int64 }
        locale: { type: string, example: en }
        permissions: { $ref: "#/components/schemas/EffectivePermissions" }
        notice:
          type: string
          description: Moderator warning to show once on login, if any.
        totp_required: { type: boolean, description: "2FA is required for this account (admin, a tag, or instance-wide)" }
        conflict_threshold_minutes:
          type: integer
          minimum: 1
          maximum: 30
          description: Progress differences larger than this between devices ask which position to keep
        listening_visible: { type: boolean, description: "Show me in a book's \"who's listening\"" }
        prefs:
          type: object
          additionalProperties: true
          description: Client preferences synced across devices (opaque to the server, at most 8 KB)

    MePatch:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 64 }
        email: { type: string, maxLength: 254, description: "Empty string removes it" }
        locale: { type: string, pattern: '^[a-z]{2,3}(-[A-Z]{2})?$' }
        conflict_threshold_minutes: { type: integer, minimum: 1, maximum: 30 }
        listening_visible: { type: boolean }
        prefs: { type: object, additionalProperties: true }

    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, maxLength: 256, format: password }
        new_password: { type: string, minLength: 10, maxLength: 256, format: password }

    TotpDisable:
      type: object
      required: [password, code]
      properties:
        password: { type: string, maxLength: 256, format: password }
        code: { type: string, pattern: '^[0-9]{6}$' }

    TotpCode:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }

    MyStats:
      type: object
      required: [year, years, total_ms, active_days, longest_streak_days, books_finished, days, books, authors, finished]
      properties:
        year: { type: integer }
        years: { type: array, description: "Years with any listening, newest first", items: { type: integer } }
        total_ms: { type: integer, format: int64 }
        active_days: { type: integer }
        longest_streak_days: { type: integer, description: "Fun fact only (no streak features)" }
        books_finished: { type: integer }
        days:
          type: array
          description: Days with listening, in order
          items: { $ref: "#/components/schemas/StatsDay" }
        books:
          type: array
          description: Time per book, most first (top 50)
          items: { $ref: "#/components/schemas/StatsBook" }
        authors:
          type: array
          description: Top authors by listening time (top 20)
          items: { $ref: "#/components/schemas/StatsAuthor" }
        finished:
          type: array
          description: Books finished this year, most recent first
          items: { $ref: "#/components/schemas/StatsBook" }

    StatsDay:
      type: object
      required: [date, listened_ms]
      properties:
        date: { type: string, format: date }
        listened_ms: { type: integer, format: int64 }

    StatsAuthor:
      type: object
      required: [id, name, listened_ms]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        listened_ms: { type: integer, format: int64 }

    StatsBook:
      type: object
      required: [book_id, title, authors, cover_url, has_cover, listened_ms]
      properties:
        book_id: { type: string, format: uuid }
        title: { type: string }
        authors: { type: array, items: { $ref: "#/components/schemas/PersonRef" } }
        cover_url: { type: string }
        has_cover: { type: boolean }
        listened_ms: { type: integer, format: int64, description: "This year" }
        finished_at: { type: string, format: date-time }

    EffectivePermissions:
      type: object
      description: Result of authz evaluation (status → role → user overrides → tags → instance defaults).
      required: [can_upload, can_edit_metadata, can_delete_own, can_share, can_review, can_post_public]
      properties:
        can_upload: { type: boolean }
        can_edit_metadata: { type: boolean }
        can_delete_own: { type: boolean }
        can_share: { type: boolean }
        can_review: { type: boolean }
        can_post_public: { type: boolean }

    Session:
      type: object
      required: [id, device_id, device_name, platform, app_version, last_seen_at, created_at, current]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        device_name: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        app_version: { type: string }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        current: { type: boolean, description: "This is the session making the request" }

    # ── library ──
    PersonRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    SeriesRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        index: { type: string, description: "Position in the series as text (e.g. \"1\", \"2.5\")" }

    TagRef:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [genre, custom] }

    LibrarySource:
      type: string
      enum: [own_upload, distribution, recommendation]

    BookSummary:
      type: object
      required: [id, title, authors, narrators, duration_ms, cover_url, has_cover, source, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: string }
        authors: { type: array, items: { $ref: "#/components/schemas/PersonRef" } }
        narrators: { type: array, items: { $ref: "#/components/schemas/PersonRef" } }
        series: { $ref: "#/components/schemas/SeriesRef" }
        duration_ms: { type: integer, format: int64 }
        cover_url: { type: string, description: "Relative URL; add `?size=`" }
        has_cover: { type: boolean, description: "False when the book has no cover, so clients can skip the request" }
        source: { $ref: "#/components/schemas/LibrarySource" }
        progress: { $ref: "#/components/schemas/Progress" }
        added_at: { type: string, format: date-time }
        hidden: { type: boolean }
        removed_at: { type: string, format: date-time, description: "Set on the recently_removed shelf" }
        updated_at: { type: string, format: date-time }

    BookDetail:
      allOf:
        - $ref: "#/components/schemas/BookSummary"
        - type: object
          required: [files, chapters, tags, size_bytes, has_epub]
          properties:
            description: { type: string }
            publisher: { type: string }
            published_year: { type: integer }
            language: { type: string }
            isbn: { type: string }
            asin: { type: string }
            size_bytes: { type: integer, format: int64 }
            has_epub: { type: boolean }
            uploaded_by_me: { type: boolean, description: "You uploaded it (you may share it, given the permission)" }
            can_edit: { type: boolean, description: "You may edit its metadata (admin, or your upload with can_edit_metadata)" }
            locked_fields: { type: array, items: { $ref: "#/components/schemas/MetadataField" }, description: "Hand-edited fields (editors only)" }
            needs_review: { type: boolean, description: "The online match was uncertain (editors only)" }
            tags: { type: array, items: { $ref: "#/components/schemas/TagRef" } }
            files: { type: array, items: { $ref: "#/components/schemas/BookFile" } }
            chapters: { type: array, items: { $ref: "#/components/schemas/Chapter" } }

    BookFile:
      type: object
      description: One audio file. `offset_ms` maps it onto the global book timeline.
      required: [id, index, offset_ms, duration_ms, size_bytes, codec, mime_type, sha256]
      properties:
        id: { type: string, format: uuid }
        index: { type: integer }
        offset_ms: { type: integer, format: int64 }
        duration_ms: { type: integer, format: int64 }
        size_bytes: { type: integer, format: int64 }
        codec: { type: string, example: aac }
        bitrate_kbps: { type: integer }
        mime_type: { type: string, example: audio/mp4 }
        sha256: { type: string }

    Chapter:
      type: object
      description: Chapter on the global book timeline (across files).
      required: [index, title, start_ms, end_ms]
      properties:
        index: { type: integer }
        title: { type: string }
        start_ms: { type: integer, format: int64 }
        end_ms: { type: integer, format: int64 }

    LibraryPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BookSummary" } }
        next_cursor: { type: string, description: "Absent on the last page" }

    LibraryFacet:
      type: object
      required: [id, name, count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        count: { type: integer, description: "Visible books" }
        kind: { type: string, enum: [genre, custom], description: "Tags only" }

    PersonPage:
      type: object
      required: [id, name, books]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        books: { type: array, items: { $ref: "#/components/schemas/BookSummary" } }

    SeriesPage:
      type: object
      required: [id, name, books]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        books: { type: array, items: { $ref: "#/components/schemas/BookSummary" } }

    # ── progress & sync ──
    Progress:
      type: object
      required: [book_id, position_ms, device_id, client_ts, updated_at, speed]
      properties:
        book_id: { type: string, format: uuid }
        position_ms: { type: integer, format: int64, minimum: 0 }
        device_id: { type: string, format: uuid }
        device_name: { type: string }
        client_ts: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: "Server receive time" }
        speed: { type: number, format: float, minimum: 0.5, maximum: 3.5 }
        finished_at: { type: string, format: date-time }

    ProgressUpdate:
      type: object
      required: [position_ms, device_id, client_ts, speed]
      properties:
        position_ms: { type: integer, format: int64, minimum: 0 }
        device_id: { type: string, format: uuid }
        client_ts: { type: string, format: date-time }
        speed: { type: number, format: float, minimum: 0.5, maximum: 3.5 }
        finished: { type: boolean }
        last_synced_at:
          type: string
          format: date-time
          description: |
            When this device last successfully synced progress for this book.
            Used to detect writes made in the same offline window.
        resolution:
          type: string
          description: Echo a `conflict_id` from a 409 to force this write after the user chose.

    ProgressWriteResult:
      type: object
      required: [applied, progress]
      properties:
        applied:
          type: boolean
          description: False when the write was older (by `client_ts`) than the stored record and was ignored.
        progress: { $ref: "#/components/schemas/Progress" }

    ProgressConflict:
      type: object
      required: [code, conflict_id, server, incoming]
      properties:
        code: { type: string, enum: [progress_conflict] }
        conflict_id: { type: string }
        server: { $ref: "#/components/schemas/Progress" }
        incoming: { $ref: "#/components/schemas/Progress" }

    Tombstone:
      type: object
      required: [entity, id, deleted_at]
      properties:
        entity: { type: string, enum: [library_entry, progress, bookmark, collection] }
        id: { type: string, description: "Entity id (for library_entry and progress: the book id)" }
        deleted_at: { type: string, format: date-time }

    SyncDelta:
      type: object
      required: [cursor, has_more, library, progress, bookmarks, collections, tombstones]
      properties:
        cursor: { type: string, description: "Pass as `since` next time" }
        has_more: { type: boolean }
        full: { type: boolean, description: "True when this is a full snapshot (no `since`)" }
        library:
          type: array
          description: Books that became visible or whose metadata changed
          items: { $ref: "#/components/schemas/BookSummary" }
        progress:
          type: array
          items: { $ref: "#/components/schemas/Progress" }
        bookmarks:
          type: array
          items: { $ref: "#/components/schemas/Bookmark" }
        collections:
          type: array
          items: { $ref: "#/components/schemas/Collection" }
        tombstones:
          type: array
          items: { $ref: "#/components/schemas/Tombstone" }

    # ── media ──
    HlsProfile:
      type: string
      enum: [low, medium]
      description: "`low` = HE-AAC 32 kbps mono, `medium` = AAC 64 kbps stereo"

    StreamUrlRequest:
      type: object
      properties:
        profile:
          type: string
          enum: [original, low, medium]
          default: original

    StreamUrls:
      type: object
      required: [expires_at]
      properties:
        expires_at: { type: string, format: date-time }
        files:
          type: array
          description: Present for `original`
          items:
            type: object
            required: [file_id, url]
            properties:
              file_id: { type: string, format: uuid }
              url: { type: string }
        hls_url: { type: string, description: "Present for `low`/`medium`" }
        cover_url: { type: string }

    # ── setup ──
    SetupStatus:
      type: object
      required: [setup_required]
      properties:
        setup_required: { type: boolean }
        database_configured:
          type: boolean
          description: "A database is already chosen (config.json exists); the wizard will reuse it"

    SetupDatabase:
      type: object
      required: [dialect]
      properties:
        dialect: { type: string, enum: [sqlite, postgres], default: sqlite }
        dsn:
          type: string
          description: "Postgres connection string. Ignored for SQLite (stored at /config/simpleapb.db)."

    SetupCheckResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        message: { type: string }

    SetupLibrary:
      type: object
      required: [path]
      properties:
        path: { type: string, default: /library }

    LibraryCheck:
      type: object
      required: [exists, writable, empty]
      properties:
        exists: { type: boolean }
        writable: { type: boolean }
        empty: { type: boolean, description: "True when the folder has no files yet (a warning, not an error)" }
        message: { type: string }

    SmtpSettings:
      type: object
      required: [host, port, tls, from]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        tls: { type: string, enum: [starttls, tls, none] }
        username: { type: string }
        password: { type: string, format: password }
        from: { type: string, format: email }

    SmtpTestRequest:
      type: object
      required: [smtp, to]
      properties:
        smtp: { $ref: "#/components/schemas/SmtpSettings" }
        to: { type: string, format: email }

    NtfySettings:
      type: object
      properties:
        internal_url: { type: string, description: "How the server reaches ntfy, e.g. http://ntfy:80" }
        public_url: { type: string, description: "How devices reach ntfy" }
        token: { type: string, description: "Access token; generated automatically when empty" }

    SetupAdmin:
      type: object
      required: [username, password, totp_secret, totp_code]
      properties:
        username: { type: string, minLength: 3, maxLength: 32, pattern: '^[a-zA-Z0-9_.-]+$' }
        password: { type: string, minLength: 10, maxLength: 256, format: password }
        display_name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        totp_secret: { type: string, description: "Secret from POST /setup/totp" }
        totp_code: { type: string, pattern: '^[0-9]{6}$' }

    SetupRequest:
      type: object
      required: [admin, database, library_path, base_url, instance_name]
      properties:
        admin: { $ref: "#/components/schemas/SetupAdmin" }
        database: { $ref: "#/components/schemas/SetupDatabase" }
        library_path: { type: string, default: /library }
        base_url: { type: string, description: "Public base URL, e.g. https://books.example.com" }
        smtp: { $ref: "#/components/schemas/SmtpSettings" }
        ntfy: { $ref: "#/components/schemas/NtfySettings" }
        instance_name: { type: string, minLength: 1, maxLength: 80 }
        privacy_text: { type: string }
        terms_text: { type: string }
        signup_open: { type: boolean, default: true }
        egress_mbps: { type: integer, minimum: 1, maximum: 100000, default: 80 }

    SetupResult:
      type: object
      required: [admin_id, recovery_codes]
      properties:
        admin_id: { type: string, format: uuid }
        recovery_codes:
          type: array
          description: "The admin's one-time recovery codes. Shown once."
          items: { type: string }

    # ── admin ──
    SignupRequestItem:
      type: object
      required: [id, user_id, username, status, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        message: { type: string }
        status: { type: string, enum: [pending, approved, denied] }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }

    ReasonRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 1000 }

    AdminUser:
      type: object
      required: [id, username, display_name, role, status, totp_enabled, quota_bytes, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }
        status_reason: { type: string }
        status_until: { type: string, format: date-time }
        totp_enabled: { type: boolean }
        quota_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    AdminUserPatch:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000, description: "Why; written to the audit log" }
        status:
          type: string
          enum: [active, restricted, suspended, banned]
        status_until: { type: string, format: date-time, description: "Suspension end (status = suspended)" }
        role: { $ref: "#/components/schemas/UserRole" }
        quota_bytes: { type: integer, format: int64, minimum: 0 }
        notice: { type: string, maxLength: 1000, description: "Warning shown to the user on next login; empty clears it" }

    Group:
      type: object
      required: [id, name, builtin, high_priority, members]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        builtin: { type: boolean }
        high_priority: { type: boolean, description: "Bandwidth priority class" }
        members: { type: integer }

    GroupCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        high_priority: { type: boolean, default: false }

    # ── uploads & jobs ──
    UploadItem:
      type: object
      required: [id, filename, size_bytes, received_bytes, status, created_at, updated_at]
      properties:
        id: { type: string }
        filename: { type: string }
        size_bytes: { type: integer, format: int64 }
        received_bytes: { type: integer, format: int64 }
        status: { type: string, enum: [receiving, processing, done, failed, cancelled] }
        error: { type: string, description: "Why processing failed (shown to the user)" }
        book_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    JobStatus:
      type: object
      required: [id, type, status, attempts, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        attempts: { type: integer }
        last_error: { type: string }
        result: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── master store ──
    BookStatus:
      type: string
      enum: [processing, ready, quarantined, trashed]

    MasterBook:
      type: object
      required: [id, title, authors, status, origin, folder_path, size_bytes, duration_ms, created_at, distributions]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        authors: { type: array, items: { $ref: "#/components/schemas/PersonRef" } }
        series: { $ref: "#/components/schemas/SeriesRef" }
        status: { $ref: "#/components/schemas/BookStatus" }
        status_reason: { type: string }
        origin: { type: string, enum: [scan, upload, abs_import] }
        uploader_id: { type: string, format: uuid }
        folder_path: { type: string, description: "Relative to the library root" }
        size_bytes: { type: integer, format: int64 }
        duration_ms: { type: integer, format: int64 }
        trashed_at: { type: string, format: date-time }
        purge_at: { type: string, format: date-time, description: "When the Trash will purge it automatically" }
        created_at: { type: string, format: date-time }
        distributions:
          type: array
          items: { $ref: "#/components/schemas/Distribution" }
        takedown: { $ref: "#/components/schemas/Takedown" }

    MasterBookPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MasterBook" } }
        next_cursor: { type: string }

    DistributionCreate:
      type: object
      required: [book_id, target_type, target_id]
      properties:
        book_id: { type: string, format: uuid }
        target_type: { type: string, enum: [group, user] }
        target_id: { type: string, format: uuid }
        note: { type: string, maxLength: 500 }

    Distribution:
      type: object
      required: [id, book_id, target_type, target_id, target_name, created_at]
      properties:
        id: { type: string, format: uuid }
        book_id: { type: string, format: uuid }
        target_type: { type: string, enum: [group, user] }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        note: { type: string }
        created_at: { type: string, format: date-time }

    EmptyTrashRequest:
      type: object
      required: [confirm_count, password, totp_code]
      properties:
        confirm_count: { type: integer, minimum: 0, description: "Must equal the number of books in the Trash" }
        password: { type: string, format: password }
        totp_code: { type: string, pattern: '^[0-9]{6}$' }

    # ── bookmarks & collections ──
    # ── admin panel (Phase 2 milestone 4) ──
    AdminDashboard:
      type: object
      required: [version, started_at, uptime_s, egress, live, health, inbox]
      properties:
        version: { type: string }
        started_at: { type: string, format: date-time }
        uptime_s: { type: integer, format: int64 }
        egress: { $ref: "#/components/schemas/DashboardEgress" }
        live:
          type: array
          items: { $ref: "#/components/schemas/LiveStream" }
        health: { $ref: "#/components/schemas/ServerHealth" }
        last_backup: { $ref: "#/components/schemas/OpStatus" }
        last_scrub: { $ref: "#/components/schemas/OpStatus" }
        inbox: { $ref: "#/components/schemas/InboxCounts" }

    LiveStream:
      type: object
      description: One open audio response (a stream or a download)
      required: [user_id, username, book_id, book_title, kind, priority, rate_bps, sent_bytes, since]
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        book_id: { type: string, format: uuid }
        book_title: { type: string }
        kind: { type: string, enum: [live, download] }
        priority: { type: string, enum: [admin, priority, normal] }
        bitrate_kbps: { type: integer }
        rate_bps: { type: integer, format: int64 }
        sent_bytes: { type: integer, format: int64 }
        since: { type: string, format: date-time }

    ServerHealth:
      type: object
      required: [db_bytes, disks, zfs, job_queue_depth, process_memory_bytes]
      properties:
        db_bytes: { type: integer, format: int64 }
        disks:
          type: array
          items: { $ref: "#/components/schemas/DiskUsage" }
        zfs: { type: string, description: "ZFS pool status, or \"unknown\"" }
        job_queue_depth: { type: integer }
        process_memory_bytes: { type: integer, format: int64 }
        memory_total_bytes: { type: integer, format: int64, description: "Linux only" }
        memory_available_bytes: { type: integer, format: int64, description: "Linux only" }
        load_average: { type: number, description: "1-minute load average (Linux only)" }
        cpus: { type: integer }

    GrowthPoint:
      type: object
      required: [month, users, books, storage_bytes, listening_ms]
      properties:
        month: { type: string, example: "2026-03" }
        users: { type: integer, description: "Active accounts at the end of the month" }
        books: { type: integer, description: "Books in the master store at the end of the month" }
        storage_bytes: { type: integer, format: int64 }
        listening_ms: { type: integer, format: int64, description: "Listening during the month, all users" }

    UserRef:
      type: object
      required: [id, username, display_name]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }

    AdminUserDetail:
      allOf:
        - $ref: "#/components/schemas/AdminUser"
        - type: object
          required: [tags, groups, permissions, effective, used_bytes]
          properties:
            notice: { type: string }
            used_bytes: { type: integer, format: int64 }
            last_login_at: { type: string, format: date-time }
            tags: { type: array, items: { $ref: "#/components/schemas/UserTag" } }
            groups: { type: array, items: { $ref: "#/components/schemas/Group" } }
            permissions: { $ref: "#/components/schemas/PermissionOverridesInput" }
            effective: { $ref: "#/components/schemas/EffectivePermissions" }

    PermissionOverridesInput:
      type: object
      description: Explicit values; a missing key means "not overridden"
      properties:
        can_upload: { type: boolean }
        can_edit_metadata: { type: boolean }
        can_delete_own: { type: boolean }
        can_share: { type: boolean }
        can_review: { type: boolean }
        can_post_public: { type: boolean }

    UserTag:
      type: object
      required: [id, name, require_totp, capability_overrides, members]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        require_totp: { type: boolean }
        capability_overrides: { $ref: "#/components/schemas/PermissionOverridesInput" }
        members: { type: integer }

    UserTagInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        require_totp: { type: boolean }
        capability_overrides: { $ref: "#/components/schemas/PermissionOverridesInput" }

    UserTagPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        color: { type: string, description: "Empty clears it" }
        require_totp: { type: boolean }
        capability_overrides: { $ref: "#/components/schemas/PermissionOverridesInput" }

    GroupPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        high_priority: { type: boolean }

    ResetLink:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string }
        expires_at: { type: string, format: date-time }

    PasswordReset:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string, maxLength: 1024 }
        new_password: { type: string, minLength: 10, maxLength: 256, format: password }

    Takedown:
      type: object
      required: [reason, taken_at]
      properties:
        reason: { type: string }
        taken_at: { type: string, format: date-time }
        taken_by: { type: string, format: uuid }

    AuditEntry:
      type: object
      required: [id, at, action, details]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actor_id: { type: string, format: uuid }
        actor_name: { type: string }
        action: { type: string, example: user.update }
        object_type: { type: string }
        object_id: { type: string }
        details: { type: object, additionalProperties: true }
        ip: { type: string }

    AuditPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        next_cursor: { type: string }

    AdminSettings:
      type: object
      required: [instance, auth, bandwidth, quotas, permission_defaults, smtp, ntfy, metadata]
      properties:
        instance: { $ref: "#/components/schemas/InstanceSettings" }
        auth: { $ref: "#/components/schemas/AuthSettings" }
        bandwidth: { $ref: "#/components/schemas/BandwidthSettings" }
        quotas: { $ref: "#/components/schemas/QuotaSettings" }
        permission_defaults: { $ref: "#/components/schemas/EffectivePermissions" }
        smtp: { $ref: "#/components/schemas/SmtpSettingsView" }
        ntfy: { $ref: "#/components/schemas/NtfySettingsView" }
        metadata: { $ref: "#/components/schemas/MetadataSettingsView" }

    AdminSettingsPatch:
      type: object
      properties:
        instance: { $ref: "#/components/schemas/InstanceSettingsPatch" }
        auth: { $ref: "#/components/schemas/AuthSettingsPatch" }
        bandwidth: { $ref: "#/components/schemas/BandwidthSettingsPatch" }
        quotas: { $ref: "#/components/schemas/QuotaSettingsPatch" }
        permission_defaults: { $ref: "#/components/schemas/PermissionOverridesInput" }
        smtp: { $ref: "#/components/schemas/SmtpSettingsPatch" }
        ntfy: { $ref: "#/components/schemas/NtfySettingsPatch" }
        metadata: { $ref: "#/components/schemas/MetadataSettingsPatch" }

    DashboardEgress:
      type: object
      required: [cap_bps, used_bps]
      properties:
        cap_bps: { type: integer, format: int64, description: "Global egress cap" }
        used_bps: { type: integer, format: int64, description: "Average rate of the open streams" }

    InboxCounts:
      type: object
      required: [signup_requests, review_queue, reports, metadata_review]
      properties:
        signup_requests: { type: integer }
        review_queue: { type: integer }
        reports: { type: integer }
        metadata_review: { type: integer }

    InstanceSettings:
      type: object
      required: [name, base_url, signup_open, privacy_text, terms_text, copyright_contact]
      properties:
        name: { type: string }
        base_url: { type: string }
        signup_open: { type: boolean }
        privacy_text: { type: string }
        terms_text: { type: string }
        copyright_contact: { type: string }

    AuthSettings:
      type: object
      required: [require_totp_all]
      properties:
        require_totp_all: { type: boolean }

    BandwidthSettings:
      type: object
      required: [egress_mbps, hls_cache_gb]
      properties:
        egress_mbps: { type: integer }
        hls_cache_gb: { type: integer }

    QuotaSettings:
      type: object
      required: [default_quota_bytes]
      properties:
        default_quota_bytes: { type: integer, format: int64, description: "Given to newly approved accounts; 0 = unlimited" }

    SmtpSettingsView:
      type: object
      required: [host, port, tls, username, from, password_set]
      properties:
        host: { type: string }
        port: { type: integer }
        tls: { type: string, enum: [starttls, tls, none] }
        username: { type: string }
        from: { type: string }
        password_set: { type: boolean }

    NtfySettingsView:
      type: object
      required: [internal_url, public_url, token_set]
      properties:
        internal_url: { type: string }
        public_url: { type: string }
        token_set: { type: boolean }

    InstanceSettingsPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        base_url: { type: string, maxLength: 300 }
        signup_open: { type: boolean }
        privacy_text: { type: string, maxLength: 50000 }
        terms_text: { type: string, maxLength: 50000 }
        copyright_contact: { type: string, maxLength: 2000 }

    AuthSettingsPatch:
      type: object
      properties:
        require_totp_all: { type: boolean }

    BandwidthSettingsPatch:
      type: object
      properties:
        egress_mbps: { type: integer, minimum: 1, maximum: 100000 }
        hls_cache_gb: { type: integer, minimum: 1, maximum: 10000 }

    QuotaSettingsPatch:
      type: object
      properties:
        default_quota_bytes: { type: integer, format: int64, minimum: 0 }

    SmtpSettingsPatch:
      type: object
      properties:
        host: { type: string, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        tls: { type: string, enum: [starttls, tls, none] }
        username: { type: string, maxLength: 255 }
        password: { type: string, maxLength: 1024, format: password, description: "Write-only; empty clears it" }
        from: { type: string, maxLength: 255 }

    NtfySettingsPatch:
      type: object
      properties:
        internal_url: { type: string, maxLength: 300 }
        public_url: { type: string, maxLength: 300 }
        token: { type: string, maxLength: 1024, description: "Write-only; empty clears it" }

    DiskUsage:
      type: object
      required: [name, free_bytes, total_bytes]
      properties:
        name: { type: string, enum: [config, library, cache, backups] }
        free_bytes: { type: integer, format: int64 }
        total_bytes: { type: integer, format: int64 }

    Bookmark:
      type: object
      required: [id, book_id, position_ms, updated_at]
      properties:
        id: { type: string, format: uuid }
        book_id: { type: string, format: uuid }
        position_ms: { type: integer, format: int64 }
        note: { type: string }
        updated_at: { type: string, format: date-time, description: "Last-write-wins clock (client time, clamped)" }

    BookmarkCreate:
      type: object
      required: [book_id, position_ms]
      properties:
        id: { type: string, format: uuid, description: "Client-generated id for idempotent offline creation" }
        book_id: { type: string, format: uuid }
        position_ms: { type: integer, format: int64, minimum: 0 }
        note: { type: string, maxLength: 2000 }
        client_ts: { type: string, format: date-time }

    BookmarkPatch:
      type: object
      properties:
        position_ms: { type: integer, format: int64, minimum: 0 }
        note: { type: string, maxLength: 2000 }
        client_ts: { type: string, format: date-time }

    Collection:
      type: object
      required: [id, name, book_ids, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        book_ids:
          type: array
          description: "Books in order (only books you can currently see)"
          items: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }

    CollectionCreate:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        client_ts: { type: string, format: date-time }

    CollectionPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        client_ts: { type: string, format: date-time }

    # ── push & backups ──
    PushRegistration:
      type: object
      required: [device_id]
      properties:
        device_id: { type: string, format: uuid }
        endpoint: { type: string, description: "UnifiedPush endpoint URL (https)" }

    PushSubscription:
      type: object
      required: [device_id, topic]
      properties:
        device_id: { type: string, format: uuid }
        topic: { type: string, description: "Random server topic (128-bit) on this instance's ntfy" }
        ntfy_url: { type: string, description: "Full topic URL to subscribe to, if ntfy is configured" }
        endpoint: { type: string }

    JobRef:
      type: object
      required: [job_id]
      properties:
        job_id: { type: string, format: uuid }

    BackupFile:
      type: object
      required: [name, size_bytes, created_at]
      properties:
        name: { type: string }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    OpStatus:
      type: object
      properties:
        at: { type: string, format: date-time }
        ok: { type: boolean }
        message: { type: string }

    BackupStatus:
      type: object
      required: [backups]
      properties:
        backups: { type: array, items: { $ref: "#/components/schemas/BackupFile" } }
        last_backup: { $ref: "#/components/schemas/OpStatus" }
        last_scrub: { $ref: "#/components/schemas/OpStatus" }
        last_unclean_shutdown: { $ref: "#/components/schemas/OpStatus" }

    # ── Social ──
    Review:
      type: object
      required: [id, book_id, stars, mine, hidden, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        book_id: { type: string, format: uuid }
        author: { $ref: "#/components/schemas/UserRef" }
        stars: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string }
        mine: { type: boolean }
        hidden: { type: boolean, description: "Hidden by a moderator (only the author and admins see it)" }
        hidden_reason: { type: string, description: "Admins only" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RatingSummary:
      type: object
      required: [count, average, histogram]
      properties:
        count: { type: integer }
        average: { type: number, description: "0 when there are no ratings" }
        histogram:
          type: array
          description: "Number of 1- to 5-star ratings (index 0 is one star)"
          items: { type: integer }
          minItems: 5
          maxItems: 5

    ReviewPage:
      type: object
      required: [items, summary]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Review" } }
        summary: { $ref: "#/components/schemas/RatingSummary" }
        mine: { $ref: "#/components/schemas/Review" }
        next_cursor: { type: string }

    ReviewInput:
      type: object
      required: [stars]
      properties:
        stars: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string, maxLength: 500 }

    RecommendRequest:
      type: object
      required: [user_ids]
      properties:
        user_ids:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, format: uuid }
        note: { type: string, maxLength: 300 }

    RecommendResult:
      type: object
      required: [sent, skipped]
      properties:
        sent: { type: integer }
        skipped: { type: integer, description: "People who can't see the book (they get nothing)" }

    Recommendation:
      type: object
      required: [id, book, from, created_at]
      properties:
        id: { type: string, format: uuid }
        book: { $ref: "#/components/schemas/BookSummary" }
        from: { $ref: "#/components/schemas/UserRef" }
        note: { type: string }
        created_at: { type: string, format: date-time }

    Listener:
      type: object
      required: [user, state, updated_at]
      properties:
        user: { $ref: "#/components/schemas/UserRef" }
        state: { type: string, enum: [listening, finished] }
        updated_at: { type: string, format: date-time }

    ReportReason:
      type: string
      enum: [copyright, inappropriate, spam, harassment, wrong_metadata, other]

    ReportCreate:
      type: object
      required: [object_type, object_id, reason]
      properties:
        object_type: { type: string, enum: [book, review, user] }
        object_id: { type: string, format: uuid }
        reason: { $ref: "#/components/schemas/ReportReason" }
        details: { type: string, maxLength: 1000 }

    ReportRef:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }

    GroupRef:
      type: object
      required: [id, name, public]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        public: { type: boolean, description: "The built-in Public group (sharing to it is reviewed first)" }

    ShareCreate:
      type: object
      required: [target_type, target_id]
      properties:
        target_type: { type: string, enum: [group, user] }
        target_id: { type: string, format: uuid }

    ShareResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid, description: "The share, or the review request" }
        status: { type: string, enum: [shared, pending_review] }

    Share:
      type: object
      required: [id, target_type, target_id, target_name, created_at]
      properties:
        id: { type: string, format: uuid }
        target_type: { type: string, enum: [group, user] }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        created_at: { type: string, format: date-time }

    ShareRequest:
      type: object
      required: [id, target_id, target_name, status, created_at]
      properties:
        id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        reason: { type: string, description: "Why it was rejected" }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }

    BookShares:
      type: object
      required: [shares, requests]
      properties:
        shares: { type: array, items: { $ref: "#/components/schemas/Share" } }
        requests: { type: array, items: { $ref: "#/components/schemas/ShareRequest" } }

    CollectionShare:
      type: object
      required: [id, target_type, target_id, target_name, created_at]
      properties:
        id: { type: string, format: uuid }
        target_type: { type: string, enum: [group, user] }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        created_at: { type: string, format: date-time }

    SharedCollection:
      type: object
      required: [id, name, owner, book_ids, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        owner: { $ref: "#/components/schemas/UserRef" }
        book_ids:
          type: array
          description: "Books in order (only books you can see)"
          items: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }

    # ── Moderation ──
    BookRef:
      type: object
      required: [id, title, has_cover]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        has_cover: { type: boolean }

    ReviewQueueItem:
      type: object
      required: [id, book, target, status, created_at]
      properties:
        id: { type: string, format: uuid }
        book: { $ref: "#/components/schemas/BookRef" }
        uploader: { $ref: "#/components/schemas/UserRef" }
        target: { $ref: "#/components/schemas/GroupRef" }
        status: { type: string, enum: [pending, approved, rejected] }
        reason: { type: string }
        decided_by: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }

    ReviewQueuePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ReviewQueueItem" } }
        next_cursor: { type: string }

    ReportedReview:
      type: object
      required: [id, stars, hidden]
      properties:
        id: { type: string, format: uuid }
        stars: { type: integer }
        text: { type: string }
        author: { $ref: "#/components/schemas/UserRef" }
        hidden: { type: boolean }

    AdminReport:
      type: object
      required: [id, object_type, object_id, object_label, reason, status, created_at]
      properties:
        id: { type: string, format: uuid }
        object_type: { type: string, enum: [book, review, user] }
        object_id: { type: string, format: uuid }
        object_label: { type: string, description: "Book title, reviewed book title, or username (empty if it no longer exists)" }
        book: { $ref: "#/components/schemas/BookRef" }
        review: { $ref: "#/components/schemas/ReportedReview" }
        user: { $ref: "#/components/schemas/UserRef" }
        reporter: { $ref: "#/components/schemas/UserRef" }
        reason: { $ref: "#/components/schemas/ReportReason" }
        details: { type: string }
        status: { type: string, enum: [open, resolved, dismissed] }
        resolution: { type: string, enum: [dismiss, hide_review, takedown, resolved] }
        resolution_note: { type: string }
        resolved_by: { $ref: "#/components/schemas/UserRef" }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }

    ReportPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminReport" } }
        next_cursor: { type: string }

    ReportResolve:
      type: object
      required: [action, note]
      properties:
        action: { type: string, enum: [dismiss, hide_review, takedown, resolved] }
        note: { type: string, minLength: 1, maxLength: 1000 }

    # ── Metadata ──
    MetadataField:
      type: string
      enum: [title, subtitle, description, publisher, published_year, language, isbn, asin, authors, narrators, series, genres]

    SeriesInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 300, description: "Empty removes the book from its series" }
        index: { type: string, maxLength: 20 }

    BookMetadataPatch:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 500 }
        subtitle: { type: string, maxLength: 500 }
        description: { type: string, maxLength: 20000 }
        publisher: { type: string, maxLength: 300 }
        published_year: { type: integer, minimum: 0, maximum: 2100, description: "0 clears it" }
        language: { type: string, maxLength: 35 }
        isbn: { type: string, maxLength: 20 }
        asin: { type: string, maxLength: 20 }
        authors: { type: array, maxItems: 20, items: { type: string, maxLength: 200 } }
        narrators: { type: array, maxItems: 20, items: { type: string, maxLength: 200 } }
        series: { $ref: "#/components/schemas/SeriesInput" }
        genres: { type: array, maxItems: 20, items: { type: string, maxLength: 100 } }
        unlock: { type: array, items: { $ref: "#/components/schemas/MetadataField" } }

    MetadataCandidate:
      type: object
      required: [provider, score, title, authors, narrators, genres]
      properties:
        provider: { type: string, enum: [openlibrary, googlebooks, audnexus] }
        score: { type: number, description: "Match confidence 0–1" }
        title: { type: string }
        subtitle: { type: string }
        authors: { type: array, items: { type: string } }
        narrators: { type: array, items: { type: string } }
        series: { type: string }
        series_index: { type: string }
        published_year: { type: integer }
        publisher: { type: string }
        description: { type: string }
        language: { type: string }
        isbn: { type: string }
        asin: { type: string }
        genres: { type: array, items: { type: string } }
        cover_url: { type: string }

    # ── updates ──
    ReleaseInfo:
      type: object
      required: [version, url, published_at, notes]
      properties:
        version: { type: string, example: "0.5.0" }
        url: { type: string, description: "The release page" }
        published_at: { type: string, format: date-time }
        notes: { type: string, description: "Release notes (Markdown)" }

    UpdateStatus:
      type: object
      required: [current_version, update_available, updater_present]
      properties:
        current_version: { type: string, description: '"dev" for a build from source' }
        latest: { $ref: "#/components/schemas/ReleaseInfo" }
        update_available: { type: boolean }
        checked_at: { type: string, format: date-time }
        check_error: { type: string, description: "Why the last check failed (GitHub unreachable…)" }
        updater_present:
          type: boolean
          description: The updater container is running, so "Update now" works
        last_update: { $ref: "#/components/schemas/UpdateAttempt" }

    UpdateAttempt:
      type: object
      required: [to_version, status, at]
      properties:
        from_version: { type: string }
        to_version: { type: string }
        status: { type: string, enum: [requested, running, succeeded, rolled_back, failed] }
        message: { type: string }
        at: { type: string, format: date-time }

    UpdateRequest:
      type: object
      required: [version]
      properties:
        version: { type: string, maxLength: 40, description: "A released version, e.g. 0.5.0" }

    # ── book tools ──
    ChaptersUpdate:
      type: object
      required: [chapters]
      properties:
        chapters:
          type: array
          minItems: 1
          maxItems: 2000
          items:
            type: object
            required: [title, start_ms]
            properties:
              title: { type: string, minLength: 1, maxLength: 200 }
              start_ms: { type: integer, format: int64, minimum: 0 }

    ChaptersSaved:
      type: object
      required: [chapters]
      properties:
        chapters: { type: array, items: { $ref: "#/components/schemas/Chapter" } }
        job_id:
          type: string
          format: uuid
          description: Writing the chapters into the m4b file (single-file m4b/m4a books only)

    SilenceDetect:
      type: object
      properties:
        noise_db:
          type: number
          minimum: -80
          maximum: -10
          default: -35
          description: Anything quieter than this counts as silence (dBFS)
        min_silence_ms:
          type: integer
          minimum: 300
          maximum: 10000
          default: 2000
          description: How long a silence must last to start a new chapter

    MergeRequest:
      type: object
      properties:
        reencode: { type: boolean, default: false, description: "Convert to AAC even when the audio could be copied" }
        keep_original: { type: boolean, default: false, description: "Add the m4b as a new book instead of replacing the files" }

    DuplicateCandidate:
      type: object
      required: [id, kind, book_a, book_b, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [exact, probable] }
        score: { type: number, description: "Probable matches: how close the durations are (1 = identical)" }
        book_a: { $ref: "#/components/schemas/MasterBook" }
        book_b: { $ref: "#/components/schemas/MasterBook" }
        created_at: { type: string, format: date-time }

    DuplicatePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/DuplicateCandidate" } }
        next_cursor: { type: string, description: "Absent on the last page" }

    DuplicateResolve:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [keep, merge] }
        keep_book_id: { type: string, format: uuid, description: "Required for merge: the book to keep (one of the pair)" }

    CoverFromUrl:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 2000 }

    MetadataReviewItem:
      type: object
      required: [book, authors, created_at]
      properties:
        book: { $ref: "#/components/schemas/BookRef" }
        authors: { type: array, items: { type: string } }
        score: { type: number }
        created_at: { type: string, format: date-time }

    MetadataReviewPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MetadataReviewItem" } }
        next_cursor: { type: string }

    MetadataSettingsView:
      type: object
      required: [open_library, google_books, google_books_key_set, audnexus, threshold]
      properties:
        open_library: { type: boolean }
        google_books: { type: boolean }
        google_books_key_set: { type: boolean }
        audnexus: { type: boolean }
        threshold: { type: number, description: "Score a match needs to be applied automatically (0.5–1)" }

    MetadataSettingsPatch:
      type: object
      properties:
        open_library: { type: boolean }
        google_books: { type: boolean }
        google_books_key: { type: string, maxLength: 200, description: "Write-only; empty clears it" }
        audnexus: { type: boolean }
        threshold: { type: number, minimum: 0.5, maximum: 1 }

    PasswordResetRequest:
      type: object
      required: [login]
      properties:
        login: { type: string, minLength: 1, maxLength: 254, description: "Username or email address" }

    delete:
      tags: [admin]
      operationId: liftTakedown
      summary: Lift a takedown (the book is visible again)
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: Lifted }
        "401": { $ref: "#/components/responses/Unauthorized" }

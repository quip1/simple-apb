# SPDX-License-Identifier: AGPL-3.0-or-later
#
# SOURCE OF TRUTH for the Simple APB API. Edit this first, then regenerate:
#   Go:     cd server && go generate ./...
#   TS:     cd web && npm run gen:api
#   Kotlin: android/core-api generates at build time
#   Docs:   cd web && npm run gen:docs
#
# v0 scope (Phase 0): instance info, auth, me/sessions, library, progress + delta
# sync, media/streaming. Setup wizard, uploads, admin, social etc. come later.
openapi: 3.0.3
info:
  title: Simple APB API
  version: 0.8.0
  description: |
    REST API for Simple APB. All endpoints live under `/api/v1`.

    **Conventions**
    - Every response carries an `X-Server-Version` header.
    - IDs are UUIDv7 strings. Positions and durations are integer milliseconds.
    - Timestamps are RFC 3339 UTC.
    - Errors use the `Error` schema with a stable machine-readable `code`.
    - List endpoints use opaque cursor pagination (`cursor` in, `next_cursor` out).
    - Clients authenticate with a Bearer access token (apps) or the
      `sapb_session` cookie plus `X-CSRF-Token` header (web).
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /api/v1

security:
  - bearerAuth: []
  - cookieAuth: []

tags:
  - name: instance
    description: Public instance info and health
  - name: auth
    description: Sign-up, login, tokens and two-factor auth
  - name: me
    description: The signed-in user and their device sessions
  - name: library
    description: Browsing the books visible to the user
  - name: progress
    description: Listening progress and delta sync
  - name: media
    description: Audio files, HLS streams, covers and signed cast URLs
  - name: setup
    description: First-run setup wizard (needs the one-time setup token from the server log)
  - name: uploads
    description: Resumable uploads (tus) and background jobs
  - name: admin
    description: Instance administration (admin role only)

paths:
  # ───────────────────────────── Instance ─────────────────────────────
  /health:
    get:
      tags: [instance]
      operationId: getHealth
      summary: Liveness check (used by container healthchecks)
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /instance:
    get:
      tags: [instance]
      operationId: getInstance
      summary: Public instance information
      description: Name, version, client version guard, sign-up state, legal text, login options.
      security: []
      responses:
        "200":
          description: Instance info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Instance" }

  # ─────────────────────────────── Auth ───────────────────────────────
  /auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: Request an account (creates a pending user awaiting admin approval)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "202":
          description: Request received; an admin must approve it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with username + password
      description: |
        Returns tokens, or `totp_required` with a short-lived challenge to pass to
        `POST /auth/totp/verify`. Pending/denied users get 403 with a code that
        says so.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in, or second factor needed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/totp/verify:
    post:
      tags: [auth]
      operationId: verifyTotp
      summary: Complete login with a TOTP code or a recovery code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpVerifyRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/totp/enroll:
    post:
      tags: [auth]
      operationId: enrollTotp
      summary: Start TOTP enrollment (returns secret + otpauth URI)
      responses:
        "200":
          description: Enrollment started; confirm with a code to activate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpEnrollment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/totp/confirm:
    post:
      tags: [auth]
      operationId: confirmTotp
      summary: Confirm TOTP enrollment; returns the 10 one-time recovery codes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpConfirmRequest" }
      responses:
        "200":
          description: TOTP active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Exchange a refresh token for a new token pair (rotating)
      description: |
        The old refresh token is invalidated. Reusing an already-rotated refresh
        token revokes the whole device session (theft detection). Web clients
        send no body; the refresh cookie is used.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current device session
      responses:
        "204": { description: "Logged out" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ──────────────────────────────── Me ────────────────────────────────
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: The current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Edit my profile and preferences
      description: Only the fields present are changed. `prefs` replaces the stored object (last write wins).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MePatch" }
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /me/password:
    post:
      tags: [me]
      operationId: changeMyPassword
      summary: Change my password (signs out my other devices)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: "Changed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me/totp/disable:
    post:
      tags: [me]
      operationId: disableMyTotp
      summary: Turn off two-factor authentication
      description: Needs the password and a current code. Refused (403 `totp_required`) for admins and when a tag or the instance requires 2FA.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpDisable" }
      responses:
        "204": { description: "Turned off" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me/recovery-codes:
    post:
      tags: [me]
      operationId: regenerateRecoveryCodes
      summary: Replace my recovery codes (the old ones stop working)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCode" }
      responses:
        "200":
          description: Ten new codes, shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me/stats:
    get:
      tags: [me]
      operationId: getMyStats
      summary: My listening stats for a year (charts and year in review)
      description: |
        Built from listening history. Listening time is real time (at 2× speed, an hour of
        book counts as 30 minutes); seeks and pauses don't count. Days are calendar days in `tz`.
      parameters:
        - name: year
          in: query
          description: Defaults to the current year in `tz`
          schema: { type: integer, minimum: 2000, maximum: 2200 }
        - name: tz
          in: query
          description: IANA time zone, e.g. Europe/Berlin
          schema: { type: string, default: UTC, maxLength: 64 }
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyStats" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/sessions:
    get:
      tags: [me]
      operationId: listMySessions
      summary: My device sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [me]
      operationId: revokeMyOtherSessions
      summary: Sign out all my other devices
      responses:
        "204": { description: "Revoked" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/sessions/{sessionId}:
    delete:
      tags: [me]
      operationId: revokeMySession
      summary: Revoke one of my sessions
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204": { description: "Revoked" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ────────────────────────────── Library ─────────────────────────────
  /library:
    get:
      tags: [library]
      operationId: listLibrary
      summary: My library (own uploads ∪ distributions, minus removed/hidden/filtered/taken down)
      parameters:
        - name: shelf
          in: query
          schema:
            type: string
            enum: [all, in_progress, not_started, finished, archived, recently_removed]
            default: all
        - { name: series, in: query, schema: { type: string, format: uuid } }
        - { name: author, in: query, schema: { type: string, format: uuid } }
        - { name: narrator, in: query, schema: { type: string, format: uuid } }
        - { name: tag, in: query, description: "Genre or custom book tag id", schema: { type: string, format: uuid } }
        - { name: collection, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, description: "Full-text search over title/author/narrator/series", schema: { type: string, maxLength: 200 } }
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent_added, recent_played, title, author, series, duration]
            default: recent_added
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of books
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /library/facets:
    get:
      tags: [library]
      operationId: listLibraryFacets
      summary: Series, authors, narrators or tags in my library, with book counts
      description: Powers the Library's Series/Authors/Narrators/Genres views. Counts only books on the "all" shelf (not archived or removed).
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [series, authors, narrators, tags] }
      responses:
        "200":
          description: Facets, by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LibraryFacet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /books/{bookId}:
    get:
      tags: [library]
      operationId: getBook
      summary: Book detail (files, chapters, my progress)
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/library/{bookId}:
    delete:
      tags: [library]
      operationId: removeFromMyLibrary
      summary: Remove a book from my view (restorable for 30 days; master copy is kept)
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: "Removed from my library" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/library/{bookId}/restore:
    post:
      tags: [library]
      operationId: restoreToMyLibrary
      summary: Restore a book from "Recently removed", or un-archive it
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: "Restored" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }

  /me/library/{bookId}/hide:
    post:
      tags: [library]
      operationId: hideInMyLibrary
      summary: Archive (hide) a book in my library
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: "Archived" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /authors/{personId}:
    get:
      tags: [library]
      operationId: getAuthor
      summary: Author page (books visible to me)
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Author
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /narrators/{personId}:
    get:
      tags: [library]
      operationId: getNarrator
      summary: Narrator page (books visible to me)
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Narrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /series/{seriesId}:
    get:
      tags: [library]
      operationId: getSeries
      summary: Series page (books in order, visible to me)
      parameters:
        - name: seriesId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── Progress ─────────────────────────────
  /me/progress/{bookId}:
    get:
      tags: [progress]
      operationId: getProgress
      summary: My stored progress for a book
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Progress" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [progress]
      operationId: putProgress
      summary: Report playback position
      description: |
        Sent every 15 s while playing, on pause/stop/seek and on app background;
        queued in a local outbox while offline and flushed in order.

        The server keeps the latest record by `client_ts`. If the incoming
        position differs from the stored one by more than the user's conflict
        threshold (default 3 min) **and** the two writes came from different
        devices within the same offline window, the server answers **409** with
        both candidates. The client asks the user, then re-sends the chosen
        position with `resolution` set to the returned `conflict_id`; that
        write always wins and is logged.
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgressUpdate" }
      responses:
        "200":
          description: Stored (or ignored as older than the stored record — see `applied`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressWriteResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Position conflict between devices; the user must choose
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressConflict" }

  /me/sync:
    get:
      tags: [progress]
      operationId: getSyncDelta
      summary: Everything that changed for me since a cursor
      description: |
        The single call clients make on reconnect. Omit `since` for a full
        snapshot. Returns library visibility changes, progress, bookmarks,
        collections and tombstones. While `has_more` is true, call again with
        the returned `cursor`; store the final one. A tombstone for a
        `library_entry` means the book is no longer visible to you.

        Open clients can also connect to the WebSocket at `/ws` (Bearer header or
        session cookie), which sends `{"type":"changed","seq":N}` hints so they
        sync immediately.
      parameters:
        - name: since
          in: query
          description: Opaque cursor from a previous response
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Delta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncDelta" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "410":
          description: Cursor too old (change log pruned); do a full sync without `since`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ────────────────────────────── Media ───────────────────────────────
  /books/{bookId}/files/{fileId}:
    get:
      tags: [media]
      operationId: getBookFile
      summary: Original audio file (supports HTTP Range)
      description: Auth by token/cookie, or by a signed `sig` from `POST /books/{bookId}/stream-url`.
      security:
        - bearerAuth: []
        - cookieAuth: []
        - streamSignature: []
      parameters:
        - $ref: "#/components/parameters/BookId"
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          required: false
          schema: { type: string, example: "bytes=0-1048575" }
        - name: download
          in: query
          required: false
          description: "Set for bulk downloads (offline copies). Unset = live playback, which gets a guaranteed share of bandwidth (bitrate × 1.5) before downloads are served."
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Whole file
          headers:
            Accept-Ranges: { schema: { type: string, enum: [bytes] } }
          content:
            audio/*:
              schema: { type: string, format: binary }
        "206":
          description: Partial content
          headers:
            Content-Range: { schema: { type: string } }
          content:
            audio/*:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "416": { description: "Range not satisfiable" }

  /stream/{bookId}/hls/{profile}/index.m3u8:
    get:
      tags: [media]
      operationId: getHlsPlaylist
      summary: Low-bitrate HLS playlist for the whole book (generated on demand)
      security:
        - bearerAuth: []
        - cookieAuth: []
        - streamSignature: []
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/HlsProfile"
      responses:
        "200":
          description: HLS media playlist
          content:
            application/vnd.apple.mpegurl:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /stream/{bookId}/hls/{profile}/{segment}:
    get:
      tags: [media]
      operationId: getHlsSegment
      summary: One 10 s HLS segment
      security:
        - bearerAuth: []
        - cookieAuth: []
        - streamSignature: []
      parameters:
        - $ref: "#/components/parameters/BookId"
        - $ref: "#/components/parameters/HlsProfile"
        - name: segment
          in: path
          required: true
          schema: { type: string, pattern: '^seg_[0-9]{6}\.(ts|m4s|aac)$' }
      responses:
        "200":
          description: Segment
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /books/{bookId}/stream-url:
    post:
      tags: [media]
      operationId: createStreamUrl
      summary: Signed, short-lived stream URLs for casting targets
      description: Bound to user + book; expire after 6 h. Casting devices fetch audio without app tokens.
      parameters:
        - $ref: "#/components/parameters/BookId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StreamUrlRequest" }
      responses:
        "200":
          description: Signed URLs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamUrls" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /books/{bookId}/cover:
    get:
      tags: [media]
      operationId: getBookCover
      summary: Cover image (resized variant)
      security:
        - bearerAuth: []
        - cookieAuth: []
        - streamSignature: []
      parameters:
        - $ref: "#/components/parameters/BookId"
        - name: size
          in: query
          schema: { type: integer, enum: [128, 256, 512, 1024], default: 512 }
      responses:
        "200":
          description: JPEG cover
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── Setup wizard ─────────────────────────
  /setup/status:
    get:
      tags: [setup]
      operationId: getSetupStatus
      summary: Whether the first-run wizard still needs to run
      security: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }

  /setup/database/test:
    post:
      tags: [setup]
      operationId: testSetupDatabase
      summary: Check that a database can be opened
      security:
        - setupToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupDatabase" }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupCheckResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /setup/library/test:
    post:
      tags: [setup]
      operationId: testSetupLibrary
      summary: Check the library path exists and is writable (warns if empty)
      security:
        - setupToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupLibrary" }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryCheck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /setup/smtp/test:
    post:
      tags: [setup]
      operationId: testSetupSmtp
      summary: Send a test email with the given SMTP settings
      security:
        - setupToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmtpTestRequest" }
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupCheckResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /setup/totp:
    post:
      tags: [setup]
      operationId: createSetupTotp
      summary: Generate the first admin's TOTP secret (enrollment is mandatory)
      security:
        - setupToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        "200":
          description: Secret to show as a QR code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpEnrollment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /setup/complete:
    post:
      tags: [setup]
      operationId: completeSetup
      summary: Finish the wizard (creates the admin, stores settings, switches the server to normal mode)
      security:
        - setupToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "200":
          description: Instance is set up; sign in as the admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ─────────────────────────────── Admin ──────────────────────────────
  /admin/signup-requests:
    get:
      tags: [admin]
      operationId: listSignupRequests
      summary: Sign-up requests (moderation inbox)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, denied], default: pending }
      responses:
        "200":
          description: Requests, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SignupRequestItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/signup-requests/{requestId}/approve:
    post:
      tags: [admin]
      operationId: approveSignupRequest
      summary: Approve a sign-up (user becomes active and joins Public)
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "204": { description: Approved }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/signup-requests/{requestId}/deny:
    post:
      tags: [admin]
      operationId: denySignupRequest
      summary: Deny a sign-up
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "204": { description: Denied }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: Users
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/UserStatus" }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{userId}:
    patch:
      tags: [admin]
      operationId: patchUser
      summary: Change a user's status, role, quota or notice (a reason is required)
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUserPatch" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/groups:
    get:
      tags: [admin]
      operationId: listGroups
      summary: Groups
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: createGroup
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/groups/{groupId}:
    delete:
      tags: [admin]
      operationId: deleteGroup
      summary: Delete a group (the built-in Public group cannot be deleted)
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/groups/{groupId}/members/{userId}:
    put:
      tags: [admin]
      operationId: addGroupMember
      summary: Add a user to a group
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: Added }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin]
      operationId: removeGroupMember
      summary: Remove a user from a group
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/sessions/{sessionId}:
    delete:
      tags: [admin]
      operationId: adminRevokeSession
      summary: Revoke any user's session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── Uploads & jobs ───────────────────────
  /me/uploads:
    get:
      tags: [uploads]
      operationId: listMyUploads
      summary: My recent uploads and their processing status
      description: |
        Files are uploaded with the **tus 1.0 resumable protocol** at `/api/v1/uploads/`
        (not described operation-by-operation here). Create an upload with
        `POST /api/v1/uploads/` and headers `Tus-Resumable: 1.0.0`, `Upload-Length`, and
        `Upload-Metadata` containing `filename` (required) and optionally `sha256`
        (hex, verified after the last chunk). Accepted: `.m4b`, `.m4a`, `.mp3`, or a `.zip`
        of one book's mp3 files. Quota is checked before the upload starts.
        After the final chunk the server imports the book in the background; poll this
        endpoint (or wait for the push notification) for the result.
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Uploads, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UploadItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /jobs/{jobId}:
    get:
      tags: [uploads]
      operationId: getJob
      summary: Status of a background job you started (admins can see any)
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─────────────────────── Admin: master store ────────────────────────
  /admin/books:
    get:
      tags: [admin]
      operationId: listMasterBooks
      summary: Browse the master store (every book the server holds)
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/BookStatus" }
        - { name: q, in: query, description: Title search, schema: { type: string, maxLength: 200 } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of books
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterBookPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/books/{bookId}:
    get:
      tags: [admin]
      operationId: getMasterBook
      summary: One master-store book with its distributions
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "200":
          description: Book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MasterBook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin]
      operationId: trashBook
      summary: Move a book to the Trash (hidden everywhere; purged after 30 days)
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: Trashed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/books/{bookId}/restore:
    post:
      tags: [admin]
      operationId: restoreBook
      summary: Restore a book from the Trash
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: Restored }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/books/{bookId}/purge:
    post:
      tags: [admin]
      operationId: purgeBook
      summary: Permanently delete one trashed book and its files now
      parameters:
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: Purged }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/trash/empty:
    post:
      tags: [admin]
      operationId: emptyTrash
      summary: Permanently delete everything in the Trash
      description: "Requires typing the number of trashed books, plus the admin password and a TOTP code."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyTrashRequest" }
      responses:
        "200":
          description: Purged
          content:
            application/json:
              schema:
                type: object
                required: [purged]
                properties:
                  purged: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/distributions:
    post:
      tags: [admin]
      operationId: createDistribution
      summary: Make a master-store book visible to a group or a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DistributionCreate" }
      responses:
        "201":
          description: Distributed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Distribution" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/distributions/{distributionId}:
    delete:
      tags: [admin]
      operationId: revokeDistribution
      summary: Revoke a distribution
      parameters:
        - name: distributionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/library/scan:
    post:
      tags: [admin]
      operationId: scanLibrary
      summary: Rescan the library folder now
      responses:
        "202":
          description: Scan queued
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ───────────────────────── Bookmarks & collections ──────────────────
  /me/bookmarks:
    get:
      tags: [progress]
      operationId: listBookmarks
      summary: My bookmarks (optionally for one book)
      parameters:
        - name: book_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Bookmarks, by book then position
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Bookmark" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [progress]
      operationId: createBookmark
      summary: Add a bookmark
      description: "Clients may send their own `id` (UUID) so an offline-created bookmark syncs idempotently: re-sending the same id returns the existing bookmark."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookmarkCreate" }
      responses:
        "201":
          description: Created (or the existing bookmark with that id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bookmark" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/bookmarks/{bookmarkId}:
    patch:
      tags: [progress]
      operationId: updateBookmark
      summary: Edit a bookmark (last write wins by client_ts)
      parameters:
        - $ref: "#/components/parameters/BookmarkId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookmarkPatch" }
      responses:
        "200":
          description: The bookmark after the write (unchanged if the edit was older)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bookmark" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [progress]
      operationId: deleteBookmark
      summary: Delete a bookmark (leaves a tombstone for other devices)
      parameters:
        - $ref: "#/components/parameters/BookmarkId"
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/collections:
    get:
      tags: [progress]
      operationId: listCollections
      summary: My collections
      responses:
        "200":
          description: Collections
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Collection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [progress]
      operationId: createCollection
      summary: Create a collection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionCreate" }
      responses:
        "201":
          description: Created (or the existing collection with that id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/collections/{collectionId}:
    patch:
      tags: [progress]
      operationId: updateCollection
      summary: Rename or describe a collection (last write wins by client_ts)
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionPatch" }
      responses:
        "200":
          description: The collection after the write
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [progress]
      operationId: deleteCollection
      summary: Delete a collection (books are not affected)
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /me/collections/{collectionId}/books/{bookId}:
    put:
      tags: [progress]
      operationId: addToCollection
      summary: Add a book to a collection
      parameters:
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: Added }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [progress]
      operationId: removeFromCollection
      summary: Remove a book from a collection
      parameters:
        - $ref: "#/components/parameters/CollectionId"
        - $ref: "#/components/parameters/BookId"
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── Devices / push ───────────────────────
  /devices/push-subscription:
    post:
      tags: [me]
      operationId: registerPush
      summary: Register this device for push notifications
      description: |
        Send your UnifiedPush `endpoint` (from the distributor app, e.g. ntfy) and the server
        POSTs events there. Without an endpoint you get a random server topic on this
        instance's ntfy to subscribe to directly. Payloads never contain content, only
        `{"type": "...", "id": "..."}`; fetch details from the API.
        Event types: `upload_done`, `upload_failed`, `library_added`, and for admins
        `signup_request`, `backup_failed`, `integrity_failed`, `unclean_shutdown`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushRegistration" }
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushSubscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /devices/push-subscription/{deviceId}:
    delete:
      tags: [me]
      operationId: unregisterPush
      summary: Stop push notifications for a device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Unregistered }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ─────────────────────── Admin: backups & integrity ─────────────────
  /admin/backups:
    get:
      tags: [admin]
      operationId: getBackups
      summary: Database backups and the latest backup/scrub status
      responses:
        "200":
          description: Backup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      operationId: runBackup
      summary: Back up the database now
      responses:
        "202":
          description: Backup queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/integrity-check:
    post:
      tags: [admin]
      operationId: runIntegrityCheck
      summary: Re-hash every library file against its stored checksum now
      responses:
        "202":
          description: Scrub queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobRef" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 15-minute access token from login/refresh.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sapb_session
      description: Web/admin. HttpOnly, SameSite=Lax. State-changing requests also need `X-CSRF-Token`.
    setupToken:
      type: apiKey
      in: header
      name: X-Setup-Token
      description: One-time token printed to the server log on first start.
    streamSignature:
      type: apiKey
      in: query
      name: sig
      description: Signed stream token from `POST /books/{bookId}/stream-url`.

  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PersonId:
      name: personId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HlsProfile:
      name: profile
      in: path
      required: true
      schema: { $ref: "#/components/schemas/HlsProfile" }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BookmarkId:
      name: bookmarkId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from `next_cursor`
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found (or not visible to you)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict with current state
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Gone:
      description: No longer available
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ── common ──
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `invalid_credentials`, `account_pending`, `rate_limited`.
        message:
          type: string
          description: Human-readable English message (clients show their own translated text by `code`).
        details:
          type: object
          additionalProperties: true

    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }

    Instance:
      type: object
      required: [name, version, api_version, min_client_version, signup_open, setup_required, oidc_providers]
      properties:
        name: { type: string }
        version: { type: string, description: "Server semver" }
        api_version: { type: string, example: "v1" }
        min_client_version:
          $ref: "#/components/schemas/ClientVersionGuard"
        signup_open: { type: boolean }
        setup_required: { type: boolean, description: "True until the first-run wizard is finished" }
        privacy_text: { type: string }
        terms_text: { type: string }
        copyright_contact: { type: string }
        oidc_providers:
          type: array
          items: { $ref: "#/components/schemas/OidcProvider" }

    ClientVersionGuard:
      type: object
      description: Clients below `required` must block with "Update required"; below `recommended` show a soft banner.
      properties:
        android: { $ref: "#/components/schemas/VersionPair" }
        wear: { $ref: "#/components/schemas/VersionPair" }
        web: { $ref: "#/components/schemas/VersionPair" }
        windows: { $ref: "#/components/schemas/VersionPair" }

    VersionPair:
      type: object
      required: [required, recommended]
      properties:
        required: { type: string }
        recommended: { type: string }

    OidcProvider:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string }
        display_name: { type: string }

    Platform:
      type: string
      enum: [android, wear, web, windows, other]

    # ── auth ──
    SignupRequest:
      type: object
      required: [username, password, age_confirmed, terms_accepted]
      properties:
        username: { type: string, minLength: 3, maxLength: 32, pattern: '^[a-zA-Z0-9_.-]+$' }
        password: { type: string, minLength: 10, maxLength: 256, format: password }
        email: { type: string, format: email }
        message: { type: string, maxLength: 500, description: "Optional note to the admin" }
        age_confirmed: { type: boolean }
        terms_accepted: { type: boolean }

    SignupAccepted:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending] }

    DeviceInfo:
      type: object
      required: [device_id, device_name, platform, app_version]
      properties:
        device_id: { type: string, format: uuid, description: "Generated once per install" }
        device_name: { type: string, maxLength: 100 }
        platform: { $ref: "#/components/schemas/Platform" }
        app_version: { type: string, maxLength: 32 }

    LoginRequest:
      type: object
      required: [username, password, device]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        device: { $ref: "#/components/schemas/DeviceInfo" }

    LoginResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, totp_required] }
        tokens: { $ref: "#/components/schemas/TokenPair" }
        totp_challenge:
          type: string
          description: Present when `status = totp_required`; valid for 5 minutes.
        user: { $ref: "#/components/schemas/Me" }

    TotpVerifyRequest:
      type: object
      required: [totp_challenge]
      properties:
        totp_challenge: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
        recovery_code: { type: string }

    TotpEnrollment:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: "Base32 secret" }
        otpauth_uri: { type: string }

    TotpConfirmRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }

    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    TokenPair:
      type: object
      required: [access_token, access_expires_at, refresh_token, refresh_expires_at]
      properties:
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string, description: "Empty for web clients (cookie is set instead)" }
        refresh_expires_at: { type: string, format: date-time }

    # ── me ──
    UserRole:
      type: string
      enum: [admin, user]

    UserStatus:
      type: string
      enum: [pending, active, restricted, suspended, banned, deleted]

    Me:
      type: object
      required: [id, username, display_name, role, status, totp_enabled, totp_required, quota_bytes, used_bytes, locale, permissions, conflict_threshold_minutes, listening_visible, prefs]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }
        totp_enabled: { type: boolean }
        quota_bytes: { type: integer, format: int64, description: "0 = unlimited" }
        used_bytes: { type: integer, format: int64 }
        locale: { type: string, example: en }
        permissions: { $ref: "#/components/schemas/EffectivePermissions" }
        notice:
          type: string
          description: Moderator warning to show once on login, if any.
        totp_required: { type: boolean, description: "2FA is required for this account (admin, a tag, or instance-wide)" }
        conflict_threshold_minutes:
          type: integer
          minimum: 1
          maximum: 30
          description: Progress differences larger than this between devices ask which position to keep
        listening_visible: { type: boolean, description: "Show me in a book's \"who's listening\"" }
        prefs:
          type: object
          additionalProperties: true
          description: Client preferences synced across devices (opaque to the server, at most 8 KB)

    MePatch:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 64 }
        email: { type: string, maxLength: 254, description: "Empty string removes it" }
        locale: { type: string, pattern: '^[a-z]{2,3}(-[A-Z]{2})?$' }
        conflict_threshold_minutes: { type: integer, minimum: 1, maximum: 30 }
        listening_visible: { type: boolean }
        prefs: { type: object, additionalProperties: true }

    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, maxLength: 256, format: password }
        new_password: { type: string, minLength: 10, maxLength: 256, format: password }

    TotpDisable:
      type: object
      required: [password, code]
      properties:
        password: { type: string, maxLength: 256, format: password }
        code: { type: string, pattern: '^[0-9]{6}$' }

    TotpCode:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }

    MyStats:
      type: object
      required: [year, years, total_ms, active_days, longest_streak_days, books_finished, days, books, authors, finished]
      properties:
        year: { type: integer }
        years: { type: array, description: "Years with any listening, newest first", items: { type: integer } }
        total_ms: { type: integer, format: int64 }
        active_days: { type: integer }
        longest_streak_days: { type: integer, description: "Fun fact only (no streak features)" }
        books_finished: { type: integer }
        days:
          type: array
          description: Days with listening, in order
          items: { $ref: "#/components/schemas/StatsDay" }
        books:
          type: array
          description: Time per book, most first (top 50)
          items: { $ref: "#/components/schemas/StatsBook" }
        authors:
          type: array
          description: Top authors by listening time (top 20)
          items: { $ref: "#/components/schemas/StatsAuthor" }
        finished:
          type: array
          description: Books finished this year, most recent first
          items: { $ref: "#/components/schemas/StatsBook" }

    StatsDay:
      type: object
      required: [date, listened_ms]
      properties:
        date: { type: string, format: date }
        listened_ms: { type: integer, format: int64 }

    StatsAuthor:
      type: object
      required: [id, name, listened_ms]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        listened_ms: { type: integer, format: int64 }

    StatsBook:
      type: object
      required: [book_id, title, authors, cover_url, has_cover, listened_ms]
      properties:
        book_id: { type: string, format: uuid }
        title: { type: string }
        authors: { type: array, items: { $ref: "#/components/schemas/PersonRef" } }
        cover_url: { type: string }
        has_cover: { type: boolean }
        listened_ms: { type: integer, format: int64, description: "This year" }
        finished_at: { type: string, format: date-time }

    EffectivePermissions:
      type: object
      description: Result of authz evaluation (status → role → user overrides → tags → instance defaults).
      required: [can_upload, can_edit_metadata, can_delete_own, can_share, can_review, can_post_public]
      properties:
        can_upload: { type: boolean }
        can_edit_metadata: { type: boolean }
        can_delete_own: { type: boolean }
        can_share: { type: boolean }
        can_review: { type: boolean }
        can_post_public: { type: boolean }

    Session:
      type: object
      required: [id, device_id, device_name, platform, app_version, last_seen_at, created_at, current]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        device_name: { type: string }
        platform: { $ref: "#/components/schemas/Platform" }
        app_version: { type: string }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        current: { type: boolean, description: "This is the session making the request" }

    # ── library ──
    PersonRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    SeriesRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        index: { type: string, description: "Position in the series as text (e.g. \"1\", \"2.5\")" }

    TagRef:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [genre, custom] }

    LibrarySource:
      type: string
      enum: [own_upload, distribution, recommendation]

    BookSummary:
      type: object
      required: [id, title, authors, narrators, duration_ms, cover_url, has_cover, source, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: string }
        authors: { type: array, items: { $ref: "#/components/schemas/PersonRef" } }
        narrators: { type: array, items: { $ref: "#/components/schemas/PersonRef" } }
        series: { $ref: "#/components/schemas/SeriesRef" }
        duration_ms: { type: integer, format: int64 }
        cover_url: { type: string, description: "Relative URL; add `?size=`" }
        has_cover: { type: boolean, description: "False when the book has no cover, so clients can skip the request" }
        source: { $ref: "#/components/schemas/LibrarySource" }
        progress: { $ref: "#/components/schemas/Progress" }
        added_at: { type: string, format: date-time }
        hidden: { type: boolean }
        removed_at: { type: string, format: date-time, description: "Set on the recently_removed shelf" }
        updated_at: { type: string, format: date-time }

    BookDetail:
      allOf:
        - $ref: "#/components/schemas/BookSummary"
        - type: object
          required: [files, chapters, tags, size_bytes, has_epub]
          properties:
            description: { type: string }
            publisher: { type: string }
            published_year: { type: integer }
            language: { type: string }
            isbn: { type: string }
            asin: { type: string }
            size_bytes: { type: integer, format: int64 }
            has_epub: { type: boolean }
            tags: { type: array, items: { $ref: "#/components/schemas/TagRef" } }
            files: { type: array, items: { $ref: "#/components/schemas/BookFile" } }
            chapters: { type: array, items: { $ref: "#/components/schemas/Chapter" } }

    BookFile:
      type: object
      description: One audio file. `offset_ms` maps it onto the global book timeline.
      required: [id, index, offset_ms, duration_ms, size_bytes, codec, mime_type, sha256]
      properties:
        id: { type: string, format: uuid }
        index: { type: integer }
        offset_ms: { type: integer, format: int64 }
        duration_ms: { type: integer, format: int64 }
        size_bytes: { type: integer, format: int64 }
        codec: { type: string, example: aac }
        bitrate_kbps: { type: integer }
        mime_type: { type: string, example: audio/mp4 }
        sha256: { type: string }

    Chapter:
      type: object
      description: Chapter on the global book timeline (across files).
      required: [index, title, start_ms, end_ms]
      properties:
        index: { type: integer }
        title: { type: string }
        start_ms: { type: integer, format: int64 }
        end_ms: { type: integer, format: int64 }

    LibraryPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BookSummary" } }
        next_cursor: { type: string, description: "Absent on the last page" }

    LibraryFacet:
      type: object
      required: [id, name, count]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        count: { type: integer, description: "Visible books" }
        kind: { type: string, enum: [genre, custom], description: "Tags only" }

    PersonPage:
      type: object
      required: [id, name, books]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        books: { type: array, items: { $ref: "#/components/schemas/BookSummary" } }

    SeriesPage:
      type: object
      required: [id, name, books]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        books: { type: array, items: { $ref: "#/components/schemas/BookSummary" } }

    # ── progress & sync ──
    Progress:
      type: object
      required: [book_id, position_ms, device_id, client_ts, updated_at, speed]
      properties:
        book_id: { type: string, format: uuid }
        position_ms: { type: integer, format: int64, minimum: 0 }
        device_id: { type: string, format: uuid }
        device_name: { type: string }
        client_ts: { type: string, format: date-time }
        updated_at: { type: string, format: date-time, description: "Server receive time" }
        speed: { type: number, format: float, minimum: 0.5, maximum: 3.5 }
        finished_at: { type: string, format: date-time }

    ProgressUpdate:
      type: object
      required: [position_ms, device_id, client_ts, speed]
      properties:
        position_ms: { type: integer, format: int64, minimum: 0 }
        device_id: { type: string, format: uuid }
        client_ts: { type: string, format: date-time }
        speed: { type: number, format: float, minimum: 0.5, maximum: 3.5 }
        finished: { type: boolean }
        last_synced_at:
          type: string
          format: date-time
          description: |
            When this device last successfully synced progress for this book.
            Used to detect writes made in the same offline window.
        resolution:
          type: string
          description: Echo a `conflict_id` from a 409 to force this write after the user chose.

    ProgressWriteResult:
      type: object
      required: [applied, progress]
      properties:
        applied:
          type: boolean
          description: False when the write was older (by `client_ts`) than the stored record and was ignored.
        progress: { $ref: "#/components/schemas/Progress" }

    ProgressConflict:
      type: object
      required: [code, conflict_id, server, incoming]
      properties:
        code: { type: string, enum: [progress_conflict] }
        conflict_id: { type: string }
        server: { $ref: "#/components/schemas/Progress" }
        incoming: { $ref: "#/components/schemas/Progress" }

    Tombstone:
      type: object
      required: [entity, id, deleted_at]
      properties:
        entity: { type: string, enum: [library_entry, progress, bookmark, collection] }
        id: { type: string, description: "Entity id (for library_entry and progress: the book id)" }
        deleted_at: { type: string, format: date-time }

    SyncDelta:
      type: object
      required: [cursor, has_more, library, progress, bookmarks, collections, tombstones]
      properties:
        cursor: { type: string, description: "Pass as `since` next time" }
        has_more: { type: boolean }
        full: { type: boolean, description: "True when this is a full snapshot (no `since`)" }
        library:
          type: array
          description: Books that became visible or whose metadata changed
          items: { $ref: "#/components/schemas/BookSummary" }
        progress:
          type: array
          items: { $ref: "#/components/schemas/Progress" }
        bookmarks:
          type: array
          items: { $ref: "#/components/schemas/Bookmark" }
        collections:
          type: array
          items: { $ref: "#/components/schemas/Collection" }
        tombstones:
          type: array
          items: { $ref: "#/components/schemas/Tombstone" }

    # ── media ──
    HlsProfile:
      type: string
      enum: [low, medium]
      description: "`low` = HE-AAC 32 kbps mono, `medium` = AAC 64 kbps stereo"

    StreamUrlRequest:
      type: object
      properties:
        profile:
          type: string
          enum: [original, low, medium]
          default: original

    StreamUrls:
      type: object
      required: [expires_at]
      properties:
        expires_at: { type: string, format: date-time }
        files:
          type: array
          description: Present for `original`
          items:
            type: object
            required: [file_id, url]
            properties:
              file_id: { type: string, format: uuid }
              url: { type: string }
        hls_url: { type: string, description: "Present for `low`/`medium`" }
        cover_url: { type: string }

    # ── setup ──
    SetupStatus:
      type: object
      required: [setup_required]
      properties:
        setup_required: { type: boolean }
        database_configured:
          type: boolean
          description: "A database is already chosen (config.json exists); the wizard will reuse it"

    SetupDatabase:
      type: object
      required: [dialect]
      properties:
        dialect: { type: string, enum: [sqlite, postgres], default: sqlite }
        dsn:
          type: string
          description: "Postgres connection string. Ignored for SQLite (stored at /config/simpleapb.db)."

    SetupCheckResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        message: { type: string }

    SetupLibrary:
      type: object
      required: [path]
      properties:
        path: { type: string, default: /library }

    LibraryCheck:
      type: object
      required: [exists, writable, empty]
      properties:
        exists: { type: boolean }
        writable: { type: boolean }
        empty: { type: boolean, description: "True when the folder has no files yet (a warning, not an error)" }
        message: { type: string }

    SmtpSettings:
      type: object
      required: [host, port, tls, from]
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        tls: { type: string, enum: [starttls, tls, none] }
        username: { type: string }
        password: { type: string, format: password }
        from: { type: string, format: email }

    SmtpTestRequest:
      type: object
      required: [smtp, to]
      properties:
        smtp: { $ref: "#/components/schemas/SmtpSettings" }
        to: { type: string, format: email }

    NtfySettings:
      type: object
      properties:
        internal_url: { type: string, description: "How the server reaches ntfy, e.g. http://ntfy:80" }
        public_url: { type: string, description: "How devices reach ntfy" }
        token: { type: string, description: "Access token; generated automatically when empty" }

    SetupAdmin:
      type: object
      required: [username, password, totp_secret, totp_code]
      properties:
        username: { type: string, minLength: 3, maxLength: 32, pattern: '^[a-zA-Z0-9_.-]+$' }
        password: { type: string, minLength: 10, maxLength: 256, format: password }
        display_name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        totp_secret: { type: string, description: "Secret from POST /setup/totp" }
        totp_code: { type: string, pattern: '^[0-9]{6}$' }

    SetupRequest:
      type: object
      required: [admin, database, library_path, base_url, instance_name]
      properties:
        admin: { $ref: "#/components/schemas/SetupAdmin" }
        database: { $ref: "#/components/schemas/SetupDatabase" }
        library_path: { type: string, default: /library }
        base_url: { type: string, description: "Public base URL, e.g. https://books.example.com" }
        smtp: { $ref: "#/components/schemas/SmtpSettings" }
        ntfy: { $ref: "#/components/schemas/NtfySettings" }
        instance_name: { type: string, minLength: 1, maxLength: 80 }
        privacy_text: { type: string }
        terms_text: { type: string }
        signup_open: { type: boolean, default: true }
        egress_mbps: { type: integer, minimum: 1, maximum: 100000, default: 80 }

    SetupResult:
      type: object
      required: [admin_id, recovery_codes]
      properties:
        admin_id: { type: string, format: uuid }
        recovery_codes:
          type: array
          description: "The admin's one-time recovery codes. Shown once."
          items: { type: string }

    # ── admin ──
    SignupRequestItem:
      type: object
      required: [id, user_id, username, status, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        message: { type: string }
        status: { type: string, enum: [pending, approved, denied] }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }

    ReasonRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 1000 }

    AdminUser:
      type: object
      required: [id, username, display_name, role, status, totp_enabled, quota_bytes, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }
        status_reason: { type: string }
        status_until: { type: string, format: date-time }
        totp_enabled: { type: boolean }
        quota_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    AdminUserPatch:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000, description: "Why; written to the audit log" }
        status:
          type: string
          enum: [active, restricted, suspended, banned]
        status_until: { type: string, format: date-time, description: "Suspension end (status = suspended)" }
        role: { $ref: "#/components/schemas/UserRole" }
        quota_bytes: { type: integer, format: int64, minimum: 0 }
        notice: { type: string, maxLength: 1000, description: "Warning shown to the user on next login; empty clears it" }

    Group:
      type: object
      required: [id, name, builtin, high_priority, members]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        builtin: { type: boolean }
        high_priority: { type: boolean, description: "Bandwidth priority class" }
        members: { type: integer }

    GroupCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        high_priority: { type: boolean, default: false }

    # ── uploads & jobs ──
    UploadItem:
      type: object
      required: [id, filename, size_bytes, received_bytes, status, created_at, updated_at]
      properties:
        id: { type: string }
        filename: { type: string }
        size_bytes: { type: integer, format: int64 }
        received_bytes: { type: integer, format: int64 }
        status: { type: string, enum: [receiving, processing, done, failed, cancelled] }
        error: { type: string, description: "Why processing failed (shown to the user)" }
        book_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    JobStatus:
      type: object
      required: [id, type, status, attempts, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        attempts: { type: integer }
        last_error: { type: string }
        result: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # ── master store ──
    BookStatus:
      type: string
      enum: [processing, ready, quarantined, trashed]

    MasterBook:
      type: object
      required: [id, title, authors, status, origin, folder_path, size_bytes, duration_ms, created_at, distributions]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        authors: { type: array, items: { $ref: "#/components/schemas/PersonRef" } }
        series: { $ref: "#/components/schemas/SeriesRef" }
        status: { $ref: "#/components/schemas/BookStatus" }
        status_reason: { type: string }
        origin: { type: string, enum: [scan, upload, abs_import] }
        uploader_id: { type: string, format: uuid }
        folder_path: { type: string, description: "Relative to the library root" }
        size_bytes: { type: integer, format: int64 }
        duration_ms: { type: integer, format: int64 }
        trashed_at: { type: string, format: date-time }
        purge_at: { type: string, format: date-time, description: "When the Trash will purge it automatically" }
        created_at: { type: string, format: date-time }
        distributions:
          type: array
          items: { $ref: "#/components/schemas/Distribution" }

    MasterBookPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MasterBook" } }
        next_cursor: { type: string }

    DistributionCreate:
      type: object
      required: [book_id, target_type, target_id]
      properties:
        book_id: { type: string, format: uuid }
        target_type: { type: string, enum: [group, user] }
        target_id: { type: string, format: uuid }
        note: { type: string, maxLength: 500 }

    Distribution:
      type: object
      required: [id, book_id, target_type, target_id, target_name, created_at]
      properties:
        id: { type: string, format: uuid }
        book_id: { type: string, format: uuid }
        target_type: { type: string, enum: [group, user] }
        target_id: { type: string, format: uuid }
        target_name: { type: string }
        note: { type: string }
        created_at: { type: string, format: date-time }

    EmptyTrashRequest:
      type: object
      required: [confirm_count, password, totp_code]
      properties:
        confirm_count: { type: integer, minimum: 0, description: "Must equal the number of books in the Trash" }
        password: { type: string, format: password }
        totp_code: { type: string, pattern: '^[0-9]{6}$' }

    # ── bookmarks & collections ──
    Bookmark:
      type: object
      required: [id, book_id, position_ms, updated_at]
      properties:
        id: { type: string, format: uuid }
        book_id: { type: string, format: uuid }
        position_ms: { type: integer, format: int64 }
        note: { type: string }
        updated_at: { type: string, format: date-time, description: "Last-write-wins clock (client time, clamped)" }

    BookmarkCreate:
      type: object
      required: [book_id, position_ms]
      properties:
        id: { type: string, format: uuid, description: "Client-generated id for idempotent offline creation" }
        book_id: { type: string, format: uuid }
        position_ms: { type: integer, format: int64, minimum: 0 }
        note: { type: string, maxLength: 2000 }
        client_ts: { type: string, format: date-time }

    BookmarkPatch:
      type: object
      properties:
        position_ms: { type: integer, format: int64, minimum: 0 }
        note: { type: string, maxLength: 2000 }
        client_ts: { type: string, format: date-time }

    Collection:
      type: object
      required: [id, name, book_ids, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        book_ids:
          type: array
          description: "Books in order (only books you can currently see)"
          items: { type: string, format: uuid }
        updated_at: { type: string, format: date-time }

    CollectionCreate:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        client_ts: { type: string, format: date-time }

    CollectionPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 1000 }
        client_ts: { type: string, format: date-time }

    # ── push & backups ──
    PushRegistration:
      type: object
      required: [device_id]
      properties:
        device_id: { type: string, format: uuid }
        endpoint: { type: string, description: "UnifiedPush endpoint URL (https)" }

    PushSubscription:
      type: object
      required: [device_id, topic]
      properties:
        device_id: { type: string, format: uuid }
        topic: { type: string, description: "Random server topic (128-bit) on this instance's ntfy" }
        ntfy_url: { type: string, description: "Full topic URL to subscribe to, if ntfy is configured" }
        endpoint: { type: string }

    JobRef:
      type: object
      required: [job_id]
      properties:
        job_id: { type: string, format: uuid }

    BackupFile:
      type: object
      required: [name, size_bytes, created_at]
      properties:
        name: { type: string }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    OpStatus:
      type: object
      properties:
        at: { type: string, format: date-time }
        ok: { type: boolean }
        message: { type: string }

    BackupStatus:
      type: object
      required: [backups]
      properties:
        backups: { type: array, items: { $ref: "#/components/schemas/BackupFile" } }
        last_backup: { $ref: "#/components/schemas/OpStatus" }
        last_scrub: { $ref: "#/components/schemas/OpStatus" }
        last_unclean_shutdown: { $ref: "#/components/schemas/OpStatus" }

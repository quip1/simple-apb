        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────────── Uploads & jobs ───────────────────────
  /me/uploads:
    get:
      tags: [uploads]
      operationId: listMyUploads
      summary: My recent uploads and their processing status
      description: |
        Files are uploaded with the **tus 1.0 resumable protocol** at `/api/v1/uploads/`
        (not described operation-by-operation here). Create an upload with
        `POST /api/v1/uploads/` and headers `Tus-Resumable: 1.0.0`, `Upload-Length`, and
        `Upload-Metadata` containing `filename` (required) and optionally `sha256`
        (hex, verified after the last chunk). Accepted: `.m4b`, `.m4a`, `.mp3`, or a `.zip`
        of one book's mp3 files. Quota is checked before the upload starts.
        After the final chunk the server imports the book in the background; poll this
        endpoint (or wait for the push notification) for the result.
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Uploads, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UploadItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /jobs/{jobId}:
    get:
      tags: [uploads]
      operationId: getJob
      summary: Status of a background job you started (admins can see any)
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

